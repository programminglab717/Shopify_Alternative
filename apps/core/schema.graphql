"""An order."""
type Order {
  """
  What a cash-on-delivery order asks for in advance, by bank transfer, before it ships: it waits for it at AWAITING_PAYMENT. Zero for none; received, it counts in amountPaid.
  """
  advanceDue: Money!

  """
  What its customer agreed to in placing it through checkout, or confirming it or its draft through a link; null for orders staff and apps placed that their customers have not confirmed so.
  """
  agreement: OrderAgreement

  """Received so far. Refunds do not lower it."""
  amountPaid: Money!

  """Given back since, in refunds; never more than was paid."""
  amountRefunded: Money!

  """
  When it was given to its assignee, the member of staff seeing it through.
  """
  assignedAt: DateTime

  """
  The member of staff it is given to, to see it through; null while no one has it, and once they leave the shop.
  """
  assignee: OrderAssignee

  """The automatic discounts it was placed with, by their titles then."""
  automaticDiscounts: [String!]!

  """
  The account a bank-transfer order's customer was told to pay into, as it was when it was placed; null for other orders, and when the shop had none.
  """
  bankAccount: BankAccount
  cancelReason: OrderCancelReason
  cancelledAt: DateTime
  closedAt: DateTime

  """What the courier collects at the door."""
  codAmount: Money!

  """
  What it charges for paying on delivery, as checkout adds it where the shop charges one: in its total and in the cash collected, apart from delivery.
  """
  codFee: Money!
  confirmationStatus: OrderConfirmationStatus!
  confirmedAt: DateTime
  createdAt: DateTime!

  """The sales tax it keeps now: totalTax, less what its refunds gave back."""
  currentTotalTax: Money!

  """Whoever its mobile number belongs to."""
  customer: Customer

  """
  When the customer's details on it were erased, at their request: their name, number, email, street, the note and where they placed it from. It keeps the rest, for the accounts.
  """
  customerErasedAt: DateTime

  """
  How its customer came to the online store before placing it (ADR-139): their first visit and their last from elsewhere. Null for orders placed otherwise than through checkout, and for those the storefront knew no visit for.
  """
  customerJourneySummary: CustomerJourneySummary

  """
  The customer's link, where they follow the order and act on it while they may; null without one. orderLinkCreate makes one.
  """
  customerLink: OrderCustomerLink

  """
  The day checkout said to expect its delivery by, YYYY-MM-DD: the shop's working days for the city counted past Sundays and Pakistan's public holidays (CHK-05, ADR-595); null where it said none, as for orders staff take.
  """
  deliveryExpectedOn: String
  deliveryMethod: OrderDeliveryMethod!

  """
  The time its customer chose at checkout to have it delivered in (CHK-15, ADR-769); null where they chose none, as where the shop offers no slots.
  """
  deliverySlot: OrderDeliverySlot

  """The discount codes it was placed with, as the shop wrote them."""
  discountCodes: [String!]!
  email: String

  """
  Its timeline, newest first: what happened to it, and the comments staff and apps wrote on it.
  """
  events(
    after: String

    """1 to 250; default 50."""
    first: Int
  ): OrderEventConnection!
  financialStatus: OrderFinancialStatus!
  fulfillmentStatus: OrderFulfillmentStatus!

  """Its parcels, oldest first."""
  fulfillments: [Fulfillment!]!

  """
  The message its customer asked to go with it as a gift, for its packing slip (CHK-16, ADR-413); null for none.
  """
  giftMessage: String
  id: ID!

