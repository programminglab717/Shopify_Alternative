  blogsImportFromShopify(
    accessToken: String
    clientId: String
    clientSecret: String
    dryRun: Boolean

    """
    The store's address at Shopify, as zari.myshopify.com, its name, or a link to its admin.
    """
    store: String!
  ): BlogsImportFromShopifyPayload!

  """
  Cancels a broadcast not yet sent: one being queued stops, and its messages not yet sent are not.
  """
  broadcastCancel(id: ID!): BroadcastPayload!

  """
  Schedules a broadcast of one of the shop's approved templates, to a segment's customers who agreed to hear from it on WhatsApp, or to all who did; or of its own words by SMS, to those who agreed to hear by SMS: now, or up to 30 days ahead.
  """
  broadcastCreate(input: BroadcastInput!): BroadcastPayload!

  """Stops a running bulk operation."""
  bulkOperationCancel(id: ID!): BulkOperationPayload!

