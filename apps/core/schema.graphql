  """Turns tracking on or off, or changes what happens at zero available."""
  inventoryItemUpdate(id: ID!, input: InventoryItemInput!): InventoryItemUpdatePayload!

  """
  Sets quantities, as after a stock count. Stock recorded for an untracked item starts tracking it. All quantities are set, or none.
  """
