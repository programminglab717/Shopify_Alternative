  """
  hidePoweredBy: Boolean

  """Its link-in-bio page."""
  linkPage: LinkPageInput

  """
  Whether a pause keeps the storefront browsable, checkout alone taking no orders. Left as it is if not given; kept between pauses.
  """
  maintenanceCheckoutOnly: Boolean

  """
