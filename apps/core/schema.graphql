"""Orders, and the cash on delivery they still owe the shop."""
type CodCash {
  amount: Money!
  count: Int!
}

"""How a period's cash-on-delivery orders went at confirmation."""
type CodConfirmation {
  """Still to be confirmed or reviewed."""
  awaiting: Int!

  """
  Cancelled before anyone confirmed them: declined, unreachable, fake or out of stock.
  """
  cancelled: Int!

  """Confirmed by their customer or staff, whatever came after."""
  confirmed: Int!

  """Cash-on-delivery orders placed."""
  placed: Int!

  """
  Confirmed of those confirmed or cancelled, from 0 to 1; null while there are none. Orders still awaiting count once decided.
  """
  rate: Float
}

"""How the orders' parcels went."""
type CodDelivery {
  delivered: Int!

  """Still on their way to the customer."""
  inTransit: Int!

  """
  Lost by their couriers before reaching the customer: in neither rate, as the customer had no say. A parcel refused and then lost on its way back counts as returned.
  """
  lost: Int!

  """
  What couriers' statements charged for the returned parcels, both ways, as codRemittanceImport took them: what returns cost in charges, so far as statements have come. Packaging and stock written off are not in it.
  """
  returnCharges: Money!

  """Returned of those delivered or returned, from 0 to 1: the RTO rate."""
  returnRate: Float

  """Refused or undeliverable: on their way back, or back."""
  returned: Int!

  """
  Of the returned parcels, how many statements have charged: the rest are to come.
  """
  returnsCharged: Int!
  shipped: Int!

  """
  Delivered of those delivered or returned, from 0 to 1: the delivery success rate. Null while there are none; parcels in transit count once they arrive somewhere.
  """
  successRate: Float
}

"""
How a period's cash-on-delivery orders turned out (COD-12): confirmed of those placed, and delivered and returned of their parcels.
"""
type CodHealth {
  confirmation: CodConfirmation!
  delivery: CodDelivery!

  """
  Broken down by what `by` names, most orders first (by courier, most parcels); empty without `by`.
  """
  rows: [CodHealthRow!]!
}

"""What COD health is broken down by."""
enum CodHealthDimension {
  """
  The campaign of each order's last visit from elsewhere, its utm_campaign, in any letter case; orders without one together.
  """
  CAMPAIGN

  """
  The city each order went to, as orders keep it: known cities by name, others as typed, in any letter case.
  """
  CITY

  """The courier staff named when shipping each parcel. Parcels only."""
  COURIER

  """
  The products sold: an order counts for each product in it, and a parcel for each it carried.
  """
  PRODUCT

  """Where the orders came from, as OrderSource says."""
  SOURCE

  """
  Where each order's last visit from elsewhere came from, as CustomerVisit.source says (ADR-140); orders without a visit, such as those staff placed, together.
  """
  VISIT_SOURCE
}

"""COD health for one city, product, source or courier."""
type CodHealthRow {
  """
  Null by courier, since a courier is chosen after an order is confirmed.
  """
  confirmation: CodConfirmation
  delivery: CodDelivery!

  """
  The city, the product's ID, the OrderSource value, the courier as staff named it, where the visits came from as CustomerVisit.source has it, or the campaign in the spelling most used; null for parcels shipped without a courier named, orders without a visit, or a campaign.
  """
  key: String

  """What to call it: the product's title as last sold, for one."""
  title: String!
}

"""
Cash owed on parcels delivered between fromDays and toDays days ago, whole days.
"""
