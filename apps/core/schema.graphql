"""
A discount given without a code to every cart and checkout that qualifies while it runs, as Shopify's automatic discounts are (CHK-06): a percentage or an amount off the order's items, or free delivery. The one that takes most off the items applies, with free delivery beside it; with a code only where every one applied combines with codes.
"""
type AutomaticDiscount {
  """
  Off the order's items, for FIXED_AMOUNT discounts, never more than they come to.
  """
  amount: Money

  """For BUY_X_GET_Y: items bought for each group."""
  buyQuantity: Int

  """The collections whose products' items it is for."""
  collectionIds: [ID!]!

  """Whether a discount code may be used with it."""
  combinesWithCodes: Boolean!
  createdAt: DateTime!
  endsAt: DateTime

  """For BUY_X_GET_Y: items given in each group, at percentage off."""
  getQuantity: Int
  id: ID!
  kind: DiscountCodeKind!

  """What the order's items must come to for it to apply."""
  minimumSubtotal: Money

  """
  Percent off the order's items, for PERCENTAGE discounts: 12.5 is 12.5%; for BUY_X_GET_Y, off the items given.
  """
  percentage: Float

  """
  The products whose items it is for, with those of its collections; neither, the whole order.
  """
  productIds: [ID!]!
  startsAt: DateTime!
  status: DiscountStatus!

  """What it gives, in a line: "10% off orders of Rs 3,000 or more"."""
  summary: String!

  """What shoppers see beside what it takes off: "Eid sale"."""
  title: String!
  updatedAt: DateTime!
}

type AutomaticDiscountDeletePayload {
  deletedAutomaticDiscountId: ID
  userErrors: [UserError!]!
}

"""
An automatic discount, or what changes of one: left out, a field stays as it is, and null clears one that may be empty. One of percentage, amount and freeShipping says what it gives; giving another changes it.
"""
input AutomaticDiscountInput {
  """An amount off the order's items, in the shop currency: "500"."""
  amount: String

  """
  Items bought for each group, 1 to 100: with getQuantity, it gives items for others bought (BUY_X_GET_Y), percentage off them, 100 unless given.
  """
  buyQuantity: Int

  """The collections whose products' items it is for, up to 100."""
  collectionIds: [ID!]

  """Whether a discount code may be used with it; not unless given."""
  combinesWithCodes: Boolean

  """Null for no end."""
  endsAt: DateTime

  """Free delivery."""
  freeShipping: Boolean

  """Items given in each group, 1 to 100, the cheapest of them."""
  getQuantity: Int

  """What the order's items must come to for it to apply: "3,000"."""
  minimumSubtotal: String

  """Percent off the order's items, 0.01 to 100."""
  percentage: Float

  """
  The products whose items it is for, up to 100, with those of collectionIds; empty or null with collectionIds, the whole order. Not for free delivery.
  """
  productIds: [ID!]

  """Now unless given."""
  startsAt: DateTime

  """
  What shoppers see beside what it takes off, up to 255 characters. Needed.
  """
  title: String
}

type AutomaticDiscountPayload {
  automaticDiscount: AutomaticDiscount
  userErrors: [UserError!]!
}

