  """
  The image link previews show of its pages without one of their own (ADR-243), as Shopify's social sharing image; null for none.
  """
  sharingImage: SharingImage

  """
  Where its "Order on WhatsApp" links and WhatsApp section go, in E.164, such as +923001234567. Null until the shop sets one.
