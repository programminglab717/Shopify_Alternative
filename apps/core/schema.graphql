  """
  Its ID, where it has one in the API: prod_…, ord_…; null for settings and such.
  """
  subjectId: ID

  """What it happened to: "product", "order", "tax_settings"."""
  subjectType: String!

  """
  What happened, as the event names it: "product.updated", "order.confirmed".
  """
  type: String!
}

type ActivityEntryConnection {
