  """
  advanceDue: Money!

  """
  What its customer agreed to in placing it through checkout, or confirming it or its draft through a link; null for orders staff and apps placed that their customers have not confirmed so.
  """
  agreement: OrderAgreement

  """Received so far. Refunds do not lower it."""
  amountPaid: Money!

  """Given back since, in refunds; never more than was paid."""
  amountRefunded: Money!

  """
