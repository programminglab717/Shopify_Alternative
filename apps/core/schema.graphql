  """What couriers owe, by age, oldest last."""
  ages: [CodReceivableAge!]!

  """The courier owing most first."""
  couriers: [CourierReceivables!]!

  """On parcels still on their way, not yet collected."""
  onTheWay: CodCash!

  """Delivered, and not yet received: what couriers owe."""
  owed: CodCash!
}

"""
A courier's remittance statement (COD-10): the cash it paid over for parcels, each line matched to a parcel by its tracking number and its cash received on the parcel's order.
"""
type CodRemittance {
  charges: Money!

  """The cash the courier collected on the statement's parcels."""
  collected: Money!

  """
  What of the cash paid claims for parcels the courier lost (COMPENSATED lines).
  """
  compensated: Money!

  """As staff named it when importing."""
  courier: String!
  createdAt: DateTime!
  id: ID!

  """
  Lines to look into: all but those received in full, charges alone, and claims paid.
  """
  issueCount: Int!
  lineCount: Int!

  """The statement's lines, in the file's order."""
  lines(
    """Lines after this row of the file."""
    afterRow: Int

    """1 to 250; default 50."""
    first: Int

    """
    Only the lines to look into: all but those received in full, charges alone, and claims paid.
    """
    issuesOnly: Boolean
  ): [CodRemittanceLine!]!

  """
  What the courier paid over: the statement's net amounts, else collected less charges and tax.
  """
  paid: Money!

  """What of the cash was received on orders."""
  received: Money!

  """The statement's number or the payment's reference."""
  reference: String

  """Withheld by the courier."""
  tax: Money!
}

type CodRemittanceConnection {
  edges: [CodRemittanceEdge!]!
  nodes: [CodRemittance!]!
  pageInfo: PageInfo!
}

type CodRemittanceEdge {
  cursor: String!
  node: CodRemittance!
}

type CodRemittanceImportPayload {
  charges: Money!
