  """
  A new blog, which the storefront shows a moment later, with its articles.
  """
  blogCreate(blog: BlogCreateInput!): BlogCreatePayload!

  """
  Deletes a blog and its articles. Menus linking to them leave the links out.
  """
  blogDelete(id: ID!): BlogDeletePayload!

  """
  Changes the fields of a blog that are given; the others stay as they are.
  """
  blogUpdate(blog: BlogUpdateInput!, id: ID!): BlogUpdatePayload!

  """
  Imports a Shopify store's blogs and their articles through its Admin API (ONB-05, ADR-753), each keeping its handle and so its address at /blogs/{blog}/{article}: a blog's title and comment policy; an article's title, body, summary, author, tags, and whether it is shown and since when. A blog the shop has by handle takes the articles; articles whose handles their blog has are left as they are. Give the store and its app as productsImportFromShopify takes them; the app needs the read_content access scope. An article's image is fetched from Shopify and kept as one of the shop's files (ADR-783); one that cannot be is said in articleErrors, the article made without it. Nothing given is kept. dryRun reads the store and counts, changing nothing.
