  """
  menuUpdate(handle: String, id: ID!, items: [MenuItemUpdateInput!]!, title: String!): MenuUpdatePayload!

  """
  Changes what the shop sets for its storefront as a whole; the storefront shows it a moment later. Those not given stay as they are.
