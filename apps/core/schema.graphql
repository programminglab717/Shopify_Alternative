  """
  The blocklist entry of their main number, or else of another of theirs, if one is blocked.
  """
  blocklistEntry: BlocklistEntry

  """Every change of their marketing consent, newest first."""
  consentHistory(
    after: String

    """1 to 250; default 50."""
    first: Int
  ): ConsentEventConnection!
  createdAt: DateTime!
  deliveryHistory: CustomerDeliveryHistory!

  """The name, or the number when there is none: "0300 1234567"."""
  displayName: String!
  email: String
  emailMarketingConsent: CustomerMarketingConsent!
