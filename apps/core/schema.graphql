"""A condition a product must meet to be in a smart collection."""
type CollectionRule {
  column: CollectionRuleColumn!

  """The value to compare with; empty for IS_SET and IS_NOT_SET."""
  condition: String!
  relation: CollectionRuleRelation!
}

"""
What a smart collection rule looks at. Variant rules match if any variant does.
"""
enum CollectionRuleColumn {
  """A compare-at price above the price: IS_SET or IS_NOT_SET."""
  IS_PRICE_REDUCED
  TAG
  TITLE
  TYPE

  """A price in the shop currency."""
  VARIANT_COMPARE_AT_PRICE

  """A price in the shop currency, e.g. "2499"."""
  VARIANT_PRICE
  VARIANT_TITLE

  """A weight in grams."""
  VARIANT_WEIGHT
  VENDOR
}

input CollectionRuleInput {
  column: CollectionRuleColumn!
  condition: String! = ""
  relation: CollectionRuleRelation!
}

"""How a rule compares. Text comparisons ignore case."""
enum CollectionRuleRelation {
  CONTAINS
  ENDS_WITH
  EQUALS
  GREATER_THAN
  IS_NOT_SET
  IS_SET
  LESS_THAN
  NOT_CONTAINS
  NOT_EQUALS
  STARTS_WITH
}

type CollectionRuleSet {
  """A product needs to meet any rule, rather than all of them."""
  appliedDisjunctively: Boolean!
  rules: [CollectionRule!]!
}

input CollectionRuleSetInput {
  appliedDisjunctively: Boolean! = false
  rules: [CollectionRuleInput!]!
}

"""The order of a collection's products."""
enum CollectionSortOrder {
  """By title, A to Z."""
  ALPHA_ASC

  """By title, Z to A."""
  ALPHA_DESC

  """Oldest first."""
  CREATED

  """Newest first. The default for smart collections."""
  CREATED_DESC

  """As the merchant arranged them. Manual collections only."""
  MANUAL

  """By lowest variant price, low to high."""
  PRICE_ASC

  """By highest variant price, high to low."""
  PRICE_DESC
}

