  """
  Starts a draft order, e.g. while a customer picks items in a chat. Its lines keep the prices they are given, or else the variants' prices now. It holds no stock.
  """
  draftOrderCreate(input: DraftOrderInput!): DraftOrderCreatePayload!

  """Deletes an open draft, and its link with it."""
  draftOrderDelete(id: ID!): DraftOrderDeletePayload!

  """
  A link where the customer sees a cash-on-delivery draft, adds or corrects its address (with their number, while the draft has none), and confirms it: the draft then becomes an order the customer confirmed, unless the number is blocked or the order risky, which waits for review. A new link replaces the one before.
  """
  draftOrderLinkCreate(
    """How long it works: 1 to 720 hours; default 72."""
    expiresInHours: Int
