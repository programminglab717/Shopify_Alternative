  """
  domainUpdate(domain: DomainUpdateInput!, id: ID!): DomainPayload!

  """
  Asks DNS whether the domain points at the platform now, and marks it verified if it does; NOT_POINTED says what it points at otherwise.
  """
  domainVerify(id: ID!): DomainPayload!

  """
