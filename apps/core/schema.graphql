"""
What orders came to, as Shopify reports sales: an order counts when it was placed, cancelled ones aside, and so do the items of it that came back.
"""
type Sales {
  """
  What the shop spent on its ads (ADR-553), as recorded with adSpendSet: on the days of the period, or of the report, in its time zone; for a row by campaign, on that campaign. Null for rows by channel or by where visits came from, which ad spend is not split by. Null when the shop's plan leaves true profit out (ADR-529).
  """
  adSpend: Money

  """
  Fees charged for paying on delivery, as Shopify's reports count additional fees, without their tax.
  """
  additionalFees: Money!

  """Gross sales less discounts, over the orders; null without orders."""
  averageOrderValue: Money

  """
  What couriers paid of claims for parcels lost or damaged. Null when the shop's plan leaves true profit out (ADR-529).
  """
  claimsRecovered: Money

  """
  What the items kept cost the shop (ADR-141): each unit at what its variant cost when it was sold, those that came back aside. Units sold without a cost count nothing.
  """
  costOfGoods: Money!

  """What was taken off the items, without its share of their tax."""
  discounts: Money!

  """Gross profit as a share of net sales, 0 to 1; null without net sales."""
  grossMargin: Float

  """
  Net sales less the cost of goods, as Shopify's reports give gross profit.
  """
  grossProfit: Money!

  """
  Their items at the prices sold, without the sales tax those prices include, as Shopify's reports give gross sales.
  """
  grossSales: Money!

  """Gross sales less discounts and returns."""
  netSales: Money!

  """Orders placed, cancelled ones aside."""
  orders: Int!

  """
  What the orders made (ANL-03): total sales less taxes, the cost of goods, couriers' charges and write-offs, plus claims recovered, less ad spend where it is known (ADR-553). Payment fees are not in it yet. Null when the shop's plan leaves true profit out (ADR-529).
  """
  profit: Money

  """
  Money given back on the orders (ORD-09), with its tax, whenever it was given (ADR-250). It is beside the other amounts, not taken off them: the items that came back already are.
  """
  refunds: Money!

  """
  Net sales for each rupee spent on ads (ADR-553), to two places; null without ad spend, or when the shop's plan leaves true profit out (ADR-529).
  """
  returnOnAdSpend: Float

  """
  Items in parcels that came back, refused or undeliverable, at the prices sold, less the tax that came back with them. Refunds are the money side, and are not taken off.
  """
  returns: Money!

  """Delivery charges, without their tax."""
  shipping: Money!

  """
  What couriers' statements charged for the orders' parcels, out and back; for a parcel no statement has charged yet, what its courier account's rate card says it is likely to cost as it stands (ADR-383). Null when the shop's plan leaves true profit out (ADR-529).
  """
  shippingCosts: Money

  """
  Of shippingCosts, what is estimated by rate cards, no statement having charged it. Null when the shop's plan leaves true profit out (ADR-529).
  """
  shippingCostsEstimated: Money

  """
  The sales tax the orders include, less that of the items that came back: the orders' prices include it, and the other amounts leave it out, as Shopify's reports do.
  """
  taxes: Money!

  """
  Net sales, shipping, additional fees and taxes: what the orders came to, less what came back.
  """
  totalSales: Money!

  """
  Units sold whose variant had no cost when they were sold, which costOfGoods leaves out.
  """
  unitsWithoutCost: Int!

  """
  What the items written off cost when sold: those of parcels that came back and were not restocked, of parcels lost, and of customers' returns checked in and not restocked. Null when the shop's plan leaves true profit out (ADR-529).
  """
  writeOffs: Money
}

