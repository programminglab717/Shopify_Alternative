}

input BankTransferSettingsInput {
  """
  Replaces the account. null takes it away, which only a shop not offering bank transfer may do.
  """
  account: BankAccountInput

  """
  Replaces what checkout takes off orders paid by bank transfer. null takes it away; orders placed before keep theirs.
  """
  discount: TransferDiscountInput
  enabled: Boolean
}

