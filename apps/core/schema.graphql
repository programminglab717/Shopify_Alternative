  """
  bankAccount: BankAccount
  cancelReason: OrderCancelReason
  cancelledAt: DateTime
  closedAt: DateTime

  """What the courier collects at the door."""
  codAmount: Money!

  """
  What it charges for paying on delivery, as checkout adds it where the shop charges one: in its total and in the cash collected, apart from delivery.
  """
  codFee: Money!
  confirmationStatus: OrderConfirmationStatus!
  confirmedAt: DateTime
  createdAt: DateTime!

  """The sales tax it keeps now: totalTax, less what its refunds gave back."""
  currentTotalTax: Money!

  """Whoever its mobile number belongs to."""
  customer: Customer

  """
  When the customer's details on it were erased, at their request: their name, number, email, street, the note and where they placed it from. It keeps the rest, for the accounts.
  """
  customerErasedAt: DateTime

  """
  How its customer came to the online store before placing it (ADR-139): their first visit and their last from elsewhere. Null for orders placed otherwise than through checkout, and for those the storefront knew no visit for.
  """
  customerJourneySummary: CustomerJourneySummary

  """
  The customer's link, where they follow the order and act on it while they may; null without one. orderLinkCreate makes one.
  """
  customerLink: OrderCustomerLink

  """The discount codes it was placed with, as the shop wrote them."""
  discountCodes: [String!]!
  email: String

  """
  Its timeline, newest first: what happened to it, and the comments staff and apps wrote on it.
  """
  events(
    after: String

    """1 to 250; default 50."""
    first: Int
  ): OrderEventConnection!
  financialStatus: OrderFinancialStatus!
  fulfillmentStatus: OrderFulfillmentStatus!

  """Its parcels, oldest first."""
  fulfillments: [Fulfillment!]!
  id: ID!
  lineItems: [OrderLineItem!]!

  """Where it ships from, and where its stock was committed."""
  location: Location

  """
  The order it was merged into, as its customer placed one order, not two.
  """
  mergedInto: OrderMergedInto

  """How staff and customers refer to it, e.g. "#1001"."""
  name: String!
  note: String!
  number: Int!

  """When it was marked packed, which moves it from TO_PACK to TO_BOOK."""
  packedAt: DateTime
  paidAt: DateTime
  paymentMethod: OrderPaymentMethod!

  """
  The customer's mobile number (E.164). Staff other than owners and managers see it masked, "0300 ••••567"; confirmation agents reveal it with orderPhoneReveal, which is logged. Null once their details are erased.
  """
  phone: String

  """Its refunds, oldest first."""
  refunds: [Refund!]!
  returnStatus: OrderReturnStatus!

  """Its customer's returns, the first first (ADR-136)."""
  returns: [Return!]!

  """Cash-on-delivery orders only. Held ones wait at stage NEEDS_REVIEW."""
  risk: OrderRisk
  shippingAddress: MailingAddress!
  source: OrderSource!

  """
  The order it was split from, its items sent apart: the first one, when a part was split again.
  """
  splitFrom: OrderSplitFrom
  stage: OrderStage!
  status: OrderStatus!
  subtotalPrice: Money!
  tags: [String!]!

  """Its sales tax by rate, its lines and charges together."""
  taxLines: [TaxLine!]!

  """
  Always true: prices include sales tax, as Pakistan's consumer laws ask prices to be shown, so the tax is part of totalPrice, never added to it.
  """
  taxesIncluded: Boolean!
  totalDiscounts: Money!

  """subtotalPrice − totalDiscounts + totalShippingPrice + codFee."""
  totalPrice: Money!
  totalShippingPrice: Money!

  """
  The sales tax included in totalPrice, at the shop's rate when it was placed: its lines', and its delivery charge's and fee's where the shop's include it. Zero when the shop charged none.
  """
  totalTax: Money!

  """
  Of totalDiscounts, what checkout took off for paying by bank transfer, where the shop takes something off for it; the rest is the codes' or staff's.
  """
  transferDiscount: Money!

  """
  Receipts its customer sent through its page for its bank transfer, or for the advance it asks for, oldest first; none for other orders.
  """
  transferReceipts: [TransferReceipt!]!
  updatedAt: DateTime!

  """Starts at 1 and increases with every change."""
  version: Int!
}

