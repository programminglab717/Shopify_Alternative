"""
What a shop spent on one platform's ads on a day, or on one campaign of them (ADR-553).
"""
type AdSpendEntry {
  amount: Money!

  """
  The campaign, as its links' utm_campaign names it; null for the platform's day as a whole.
  """
  campaign: String

  """The day in the shop's time zone, as 2026-10-17."""
  day: String!
  platform: AdSpendPlatform!
  source: AdSpendSource!
}

"""One day's ad spend: an amount of 0 takes it away."""
input AdSpendInput {
  """In the shop's currency, as 2499.50."""
  amount: String!

  """
  The campaign, as its links' utm_campaign names it, up to 200 characters, for the sales report's rows by campaign; blank for the platform's day as a whole.
  """
  campaign: String

  """The day in the shop's time zone, as 2026-10-17: up to today."""
  day: String!
  platform: AdSpendPlatform!
}

"""Where a shop's ads ran (ADR-553)."""
enum AdSpendPlatform {
  """Google: search, Shopping and YouTube."""
  GOOGLE

  """Meta's apps: Facebook, Instagram, Messenger and WhatsApp."""
  META

  """Anywhere else: influencers, Snapchat, a newspaper."""
  OTHER

  """TikTok."""
  TIKTOK
}

type AdSpendSetPayload {
  """How many were recorded; null when refused."""
  count: Int
  userErrors: [UserError!]!
}

"""Where a day's ad spend came from (ADR-564, ADR-566, ADR-678)."""
enum AdSpendSource {
  """
  Pulled from the Google Ads API, from the Google Ads account the shop connected: typing over it makes it MANUAL.
  """
  GOOGLE

  """The shop typed it."""
  MANUAL

  """
  Pulled from Meta's Marketing API, from the ad account the shop connected: typing over it makes it MANUAL.
  """
  META

  """
  Pulled from TikTok's Business API, from the advertiser account the shop connected: typing over it makes it MANUAL.
  """
  TIKTOK
}

"""
