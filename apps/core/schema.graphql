"""
Who did something: an app, by its access token, a staff member, or Hatti's support agent.
"""
type AuditActor {
  """
  The access token (tok_…), or the staff member or Hatti's support agent (usr_…).
  """
  id: ID!
  kind: AuditActorKind!

  """A staff member's role at the time, e.g. "confirmation_agent"."""
  role: String
}

enum AuditActorKind {
  APP
  STAFF

  """Hatti's support, looking while the owner lets it (ADR-156)."""
  SUPPORT
}

"""
Something done in the shop that it may need to account for later: a customer's number revealed, customers exported, merged or erased, a policy changed, or what Hatti's support looked at.
"""
type AuditEntry {
  """
  e.g. "customer.phone_revealed", "order.phone_revealed", "customers.exported", "customer.merged", "customer.erased", "order_risk_settings.updated", "support.looked".
  """
  action: String!
  actor: AuditActor!

  """More about it, as a JSON object. Never contact details."""
  details: String!
  id: ID!
  occurredAt: DateTime!

  """What it was done to: a customer, an order or the shop."""
  subjectId: ID!
}

type AuditEntryConnection {
  edges: [AuditEntryEdge!]!
  nodes: [AuditEntry!]!
  pageInfo: PageInfo!
}

type AuditEntryEdge {
  cursor: String!
  node: AuditEntry!
}

"""
A bank account customers pay into by transfer, with what they're told besides (ADR-074).
"""
type BankAccount {
  """The bank, as customers pick it in their banking apps: "Meezan Bank"."""
  bankName: String!

  """Its Pakistani IBAN, unspaced: "PK36SCBL0000001123456702"."""
  iban: String!

  """
  What customers are told besides, such as where to send the receipt; empty for nothing.
  """
  instructions: String!

  """
  The mobile number its bank registered for Raast, in E.164: "+923001234567". Customers' banking apps pay to it, as to the IBAN. Null for none.
  """
  raastId: String

  """The account's title, as its bank has it: whose account it is."""
  title: String!
}

input BankAccountInput {
  """Up to 100 characters."""
  bankName: String!

  """
  A Pakistani IBAN, spaced or not, in either case: "PK36 SCBL 0000 0011 2345 6702". Its check digits are checked.
  """
  iban: String!

  """Up to 500 characters."""
  instructions: String

  """
  The mobile number its bank registered for Raast, in any format: "0300 1234567". Blank or null for none.
  """
  raastId: String

  """Up to 100 characters."""
  title: String!
}

"""How the shop's customers pay by bank transfer (PAY-02)."""
type BankTransferSettings {
  """
  The account customers pay into; null until the shop gives one. Staff may place bank-transfer orders while checkout does not offer it.
  """
  account: BankAccount

  """
  What checkout takes off orders paid by bank transfer, while it offers bank transfer; null for nothing.
  """
  discount: TransferDiscount

  """
  Whether checkout offers bank transfer beside cash on delivery, and alone above what cash on delivery may collect.
  """
  enabled: Boolean!

  """When the shop last changed them; none while it never has."""
