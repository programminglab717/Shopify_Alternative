  """
  customerCreate(input: CustomerCreateInput!): CustomerCreatePayload!

  """
  Erases a customer's personal data at their request: their profile, numbers and consent history are deleted, and their orders keep only what the shop's accounts need, without their name, number, email or street. Their orders must be closed or cancelled first. Cannot be undone.
  """
  customerErase(id: ID!): CustomerErasePayload!

