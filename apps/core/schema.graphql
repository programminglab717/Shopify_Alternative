  """
  themeFilesUpsert(files: [OnlineStoreThemeFilesUpsertFileInput!]!, themeId: ID!): ThemeFilesUpsertPayload!

  """
  Makes the theme the main one, which the storefront shows a moment later; the main one before it is unpublished.
  """
  themePublish(id: ID!): ThemePublishPayload!

  """
  A redirect from a path the shop has no page at to another address, followed by the storefront a moment later.
  """
  urlRedirectCreate(urlRedirect: UrlRedirectInput!): UrlRedirectCreatePayload!

  """Deletes a redirect: its path answers 404 again."""
  urlRedirectDelete(id: ID!): UrlRedirectDeletePayload!

  """Changes the path or target given; the other stays as it is."""
  urlRedirectUpdate(id: ID!, urlRedirect: UrlRedirectInput!): UrlRedirectUpdatePayload!

  """
  Imports redirects from a file as Shopify's redirects export has them: Redirect from and Redirect to, each checked as urlRedirectCreate checks one. Paths the shop has a redirect from are left as they are; rows that fail are listed, and the rest go in. dryRun checks and counts, changing nothing.
  """
  urlRedirectsImport(
    """The file's text, at most 1,500,000 characters."""
    csv: String!
    dryRun: Boolean
  ): UrlRedirectsImportPayload!
}

