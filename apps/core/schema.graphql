  customerPhoneReveal(id: ID!): CustomerPhoneRevealPayload!

  """Changes a customer's number, name, email, note or tags."""
  customerUpdate(id: ID!, input: CustomerUpdateInput!): CustomerUpdatePayload!

  """
  Customers as CSV: everyone, a saved segment, or a segment query, up to 10,000. Owners and managers only; every export is recorded.
  """
