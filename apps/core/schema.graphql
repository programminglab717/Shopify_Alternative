type Mutation {
  """
  Blocks a number: its new orders are held for review. Blocking a number again replaces its reason and note.
  """
  blocklistAdd(input: BlocklistAddInput!): BlocklistAddPayload!

  """
  Takes a number off the blocklist. Orders already held for review stay held.
  """
  blocklistRemove(
    """A Pakistani mobile number, in any common format."""
    phone: String!
  ): BlocklistRemovePayload!

  """Adds products to the end of a manual collection."""
  collectionAddProducts(id: ID!, productIds: [ID!]!): CollectionPayload!
  collectionCreate(input: CollectionCreateInput!): CollectionPayload!

  """Deletes a collection. Its products stay in the catalog."""
  collectionDelete(input: CollectionDeleteInput!): CollectionDeletePayload!

  """Takes products out of a manual collection."""
  collectionRemoveProducts(id: ID!, productIds: [ID!]!): CollectionPayload!

  """Moves products within a manual collection, one move after another."""
  collectionReorderProducts(id: ID!, moves: [MoveInput!]!): CollectionPayload!
  collectionUpdate(input: CollectionUpdateInput!): CollectionPayload!

  """
  Adds a customer before they order. Orders add their customers themselves, by mobile number.
  """
  customerCreate(input: CustomerCreateInput!): CustomerCreatePayload!

  """Changes a customer's number, name, email, note or tags."""
  customerUpdate(id: ID!, input: CustomerUpdateInput!): CustomerUpdatePayload!

  """The courier delivered the parcel."""
  fulfillmentMarkDelivered(id: ID!): FulfillmentMarkDeliveredPayload!

  """
  The customer refused the parcel, or it could not be delivered: it is coming back.
  """
  fulfillmentMarkReturning(id: ID!): FulfillmentMarkReturningPayload!

  """
  Checks a parcel that came back into its location. `restock` says how many of each line go back on the shelf; the rest are written off as damaged. Everything is restocked if left out.
  """
  fulfillmentReceiveReturn(id: ID!, restock: [FulfillmentRestockInput!]): FulfillmentReceiveReturnPayload!

  """
  Sets a parcel's courier, tracking number and link, e.g. once it is booked.
  """
  fulfillmentTrackingInfoUpdate(id: ID!, trackingInfo: FulfillmentTrackingInput!): FulfillmentTrackingInfoUpdatePayload!

  """
  Adds to or takes from quantities: a delivery received, damaged goods written off. Stock recorded for an untracked item starts tracking it. All changes apply, or none.
  """
  inventoryAdjustQuantities(input: InventoryAdjustQuantitiesInput!): InventoryAdjustQuantitiesPayload!

  """Turns tracking on or off, or changes what happens at zero available."""
  inventoryItemUpdate(id: ID!, input: InventoryItemInput!): InventoryItemUpdatePayload!

  """
  Sets quantities, as after a stock count. Stock recorded for an untracked item starts tracking it. All quantities are set, or none.
  """
  inventorySetQuantities(input: InventorySetQuantitiesInput!): InventorySetQuantitiesPayload!
  locationActivate(locationId: ID!): LocationActivatePayload!

  """Adds a location. A shop's first location is its primary one."""
  locationAdd(input: LocationAddInput!): LocationAddPayload!

  """
  Takes a location out of use. It must hold no stock and have no orders or checkouts waiting on it, and it cannot be the primary location.
  """
  locationDeactivate(locationId: ID!): LocationDeactivatePayload!

  """Deletes a location that never held stock; deactivate others instead."""
  locationDelete(locationId: ID!): LocationDeletePayload!
  locationEdit(id: ID!, input: LocationEditInput!): LocationEditPayload!

  """Cancels an order that has not shipped, and releases its stock."""
  orderCancel(
    id: ID!
    reason: OrderCancelReason!

    """For the timeline."""
    staffNote: String
  ): OrderCancelPayload!

  """Records that the customer confirmed a cash-on-delivery order."""
  orderConfirm(id: ID!): OrderConfirmPayload!

  """
  Places an order, e.g. one taken in a chat, and commits its stock at its location. Cash-on-delivery orders wait for the customer to confirm.
  """
  orderCreate(input: OrderCreateInput!): OrderCreatePayload!

  """
  Ships items of a confirmed or prepaid order in one parcel, taking them out of stock.
  """
  orderFulfill(id: ID!, input: OrderFulfillInput): OrderFulfillPayload!

  """
  Records that the order is paid in full: cash collected at the door, or a transfer received.
  """
  orderMarkAsPaid(id: ID!): OrderMarkAsPaidPayload!

  """
  Changes the shipping address (before anything ships), email, note or tags.
  """
  orderUpdate(id: ID!, input: OrderUpdateInput!): OrderUpdatePayload!
  productCreate(input: ProductCreateInput!): ProductCreatePayload!

  """Adds images by URL, after the existing ones."""
  productCreateMedia(media: [CreateMediaInput!]!, productId: ID!): ProductCreateMediaPayload!

  """Deletes a product with its variants, options and media."""
  productDelete(input: ProductDeleteInput!): ProductDeletePayload!

  """Deletes media; variants that showed them show none."""
  productDeleteMedia(mediaIds: [ID!]!, productId: ID!): ProductDeleteMediaPayload!

  """
  Renames or moves an option, and adds, renames or deletes its values. Values that variants use cannot be deleted.
  """
  productOptionUpdate(option: ProductOptionUpdateInput!, optionValuesToAdd: [String!], optionValuesToDelete: [ID!], optionValuesToUpdate: [ProductOptionValueUpdateInput!], productId: ID!): ProductPayload!

  """
  Adds up to 3 options in all. Existing variants take each new option's first value.
  """
  productOptionsCreate(options: [ProductOptionInput!]!, productId: ID!, variantStrategy: ProductOptionCreateVariantStrategy! = LEAVE_AS_IS): ProductPayload!

  """Deletes options, unless variants would then have the same options."""
  productOptionsDelete(options: [ID!]!, productId: ID!): ProductOptionsDeletePayload!

  """Moves media, one move after another."""
  productReorderMedia(moves: [MoveInput!]!, productId: ID!): ProductPayload!
  productUpdate(input: ProductUpdateInput!): ProductUpdatePayload!
  productUpdateMedia(media: [UpdateMediaInput!]!, productId: ID!): ProductPayload!

  """
  Adds variants. Option values the product lacks are added to its options.
  """
  productVariantsBulkCreate(productId: ID!, variants: [ProductVariantsBulkInput!]!): ProductVariantsBulkPayload!

  """Deletes variants; at least one must remain."""
  productVariantsBulkDelete(productId: ID!, variantsIds: [ID!]!): ProductPayload!

  """Changes variants in one go; two variants may swap option values."""
  productVariantsBulkUpdate(productId: ID!, variants: [ProductVariantsBulkUpdateInput!]!): ProductVariantsBulkPayload!

  """
  Saves a customer filter. The query is checked; problems come back as user errors.
  """
  segmentCreate(name: String!, query: String!): SegmentCreatePayload!

  """Deletes a segment. Its customers stay."""
  segmentDelete(id: ID!): SegmentDeletePayload!

  """Renames a segment or changes its query."""
  segmentUpdate(id: ID!, name: String, query: String): SegmentUpdatePayload!
}

