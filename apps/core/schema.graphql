  """
  discountCode: String

  """Up to 100 characters."""
  name: String!

  """A Pakistani mobile number."""
  phone: String

  """
  What their link carries after ?ref=: 2 to 40 letters, digits and hyphens, kept in lower case, unique among the shop's affiliates.
