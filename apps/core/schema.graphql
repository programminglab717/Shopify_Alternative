  returnExchangesOnly: Boolean

  """
  Rules for the storefront's robots.txt, replacing those it had: `User-agent`, `Allow`, `Disallow`, `Crawl-delay` and `Sitemap` lines, and comments. Rules before any `User-agent` are for every crawler. Blank for none.
