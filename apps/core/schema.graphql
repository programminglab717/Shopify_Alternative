}

"""
How a refund went back to the customer. Staff send the money and Hatti records it; but ONLINE, which Hatti asks the payment gateway to send.
"""
enum RefundMethod {
  """To a bank account, such as by IBFT or Raast."""
  BANK_TRANSFER

  """In cash."""
  CASH

  """
  No money moved: what was paid for items coming back went to the exchange a return sent (ADR-137), whose order the reference names. Made by returnCreate, never by orderRefund.
  """
  EXCHANGE

  """To a JazzCash or Easypaisa wallet."""
  MOBILE_WALLET

  """
  Back through the payment gateway the customer paid with online, on the order's latest payment that can take it (ADR-153): Hatti asks the gateway, and records the refund once the gateway says it is sent, with the gateway's reference. Only through gateways whose PaymentGateway.refunds is not NONE; WHOLE ones give a payment back whole.
  """
  ONLINE

  """Another way; the note says which."""
  OTHER

  """
  No money moved: the customer's store credit account was credited with it, to spend on later orders (ADR-184), the credit's transaction ID its reference. Needs the write_store_credit_account_transactions scope too.
  """
  STORE_CREDIT
}

