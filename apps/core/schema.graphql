  Adds tags to up to 250 orders. Tags an order has already, in any case, stay as they are.
  """
  orderBulkAddTags(ids: [ID!]!, tags: [String!]!): OrderBulkPayload!

  """Cancels up to 250 orders for one reason, as orderCancel does each."""
