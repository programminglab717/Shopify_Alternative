"""
How likely a cash-on-delivery order is to come back unpaid, from transparent rules: the customer's history in this shop, the order's value and size, and its address. Scored when the order is placed and when its address changes.
"""
type OrderRisk {
  level: OrderRiskLevel!

  """Strongest first."""
  reasons: [OrderRiskReason!]!

  """0 to 1."""
  score: Float!
}

"""How likely a cash-on-delivery order is to come back unpaid."""
enum OrderRiskLevel {
  """A score of 0.6 or more."""
  HIGH

  """A score under 0.3."""
  LOW

  """A score from 0.3 to under 0.6."""
  MEDIUM
}

"""Why an order scored what it did."""
type OrderRiskReason {
  """
  e.g. "refused_deliveries", "recent_order", "high_value", "unknown_city".
  """
  code: String!

  """e.g. "Refused 2 deliveries from this shop"."""
  message: String!

  """What it adds to the score, from -1 to 1; a negative weight lowers it."""
  weight: Float!
}

"""When risky cash-on-delivery orders wait for review: the shop's policy."""
type OrderRiskSettings {
  """Orders totalling this or more count as high value. Default Rs 15,000."""
  highValue: Money!

  """
  Cash-on-delivery orders whose risk score is this or more wait for review, at stage NEEDS_REVIEW; null holds none. Default 0.6, the HIGH level.
  """
  holdAt: Float

  """null while the shop has the defaults."""
  updatedAt: DateTime
}

"""Fields left out stay as they are."""
input OrderRiskSettingsInput {
  """Decimal, e.g. "15,000"."""
  highValue: String

  """From 0.01 to 1, in hundredths; null holds none."""
  holdAt: Float
}

type OrderRiskSettingsUpdatePayload {
  riskSettings: OrderRiskSettings
  userErrors: [UserError!]!
}

"""The shop's policies for its orders, but for risk."""
type OrderSettings {
  """
  When the Confirmation Desk calls customers (COD-05): outside them it deals out no order, and an unanswered one falls due again when they next open. Null for any time.
  """
  callingHours: CallingHours

  """
  Days after an order was placed when, its customer unreachable (three calls unanswered), it is cancelled and its stock let go, by a sweep every few minutes; null for never.
  """
  cancelUnreachableAfterDays: Int
  customerCancellation: CustomerCancellation!

  """
  How long an order may wait for its first call, in minutes of calling hours, before the queue says it is overdue; null for no target.
  """
  firstCallMinutes: Int

  """When the shop last changed them; none while it has the defaults."""
  updatedAt: DateTime
}

"""Those not given stay as they are."""
input OrderSettingsInput {
  """null for any time."""
  callingHours: CallingHoursInput

  """1 to 30; null for never."""
  cancelUnreachableAfterDays: Int
  customerCancellation: CustomerCancellation

  """5 to 1440; null for no target."""
  firstCallMinutes: Int
}

type OrderSettingsUpdatePayload {
  orderSettings: OrderSettings
  userErrors: [UserError!]!
}

