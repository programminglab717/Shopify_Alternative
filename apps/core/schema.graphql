  Changes the shipping address (before anything ships), email, note or tags.
  """
  orderUpdate(id: ID!, input: OrderUpdateInput!): OrderUpdatePayload!
  productCreate(input: ProductCreateInput!): ProductCreatePayload!

  """Adds images by URL, after the existing ones."""
