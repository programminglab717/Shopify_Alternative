type Query {
  """The shop's activity log, newest first. Owners and managers."""
  auditLog(
    """Only this action."""
    action: String
    after: String

    """1 to 250; default 50."""
    first: Int

    """Only what was done to this customer or order."""
    subjectId: ID
  ): AuditEntryConnection!

  """Blocked numbers, most recently blocked first."""
  blocklist(
    after: String

    """1 to 250; default 50."""
    first: Int

    """A mobile number in any format, or four or more of its digits."""
    query: String
  ): BlocklistEntryConnection!

  """A collection by ID, or null."""
  collection(id: ID!): Collection

  """A collection by handle, or null."""
  collectionByHandle(handle: String!): Collection

  """Collections, newest first."""
  collections(
    """Cursor from a previous page."""
    after: String

    """Page size, 1 to 250."""
    first: Int = 50

    """Words to find in the title."""
    query: String
  ): CollectionConnection!

  """A customer by ID, or null if not found."""
  customer(id: ID!): Customer

  """Customers, newest first."""
  customers(
    after: String

    """1 to 250; default 50."""
    first: Int

    """
    A mobile number in any format, four or more of its digits, or words of the name or email.
    """
    query: String
  ): CustomerConnection!

  """
  What the shop charges to deliver an order, which checkout adds for its city.
  """
  deliverySettings: DeliverySettings!

  """
  The shop's own domains, the primary first, then as they were connected.
  """
  domains: [Domain!]!

  """A draft order by ID, or null."""
  draftOrder(id: ID!): DraftOrder

  """Draft orders, newest first."""
  draftOrders(
    after: String

    """1 to 250; default 50."""
    first: Int
    status: DraftOrderStatus
  ): DraftOrderConnection!

  """An inventory item by ID."""
  inventoryItem(id: ID!): InventoryItem

  """A location by ID, or the primary location when no ID is given."""
  location(id: ID): Location

  """Locations in the order they were added; the first is primary."""
  locations(
    after: String

    """1 to 250; default 50."""
    first: Int

    """Include deactivated locations."""
    includeInactive: Boolean! = false
  ): LocationConnection!
  menu(id: ID!): Menu

  """
  The shop's menus: the main menu and the footer menu first, then the others by title. The first time, it makes those two from what the storefront showed until then.
  """
  menus(
    after: String

    """1 to 250; default 50."""
    first: Int
  ): MenuConnection!

  """
  What the shop sets for its storefront as a whole, such as its WhatsApp number and password.
  """
  onlineStorePreferences: OnlineStorePreferences!

  """An order by ID, or null if not found."""
  order(id: ID!): Order

  """
  Packing slips or invoices for up to 250 orders, to print from the browser: one page per order, on A4 or thermal paper, in English and Urdu by default. Customers' numbers show as the caller sees them elsewhere, masked for most staff.
  """
  orderDocument(ids: [ID!]!, kind: OrderDocumentKind!, language: DocumentLanguage! = BILINGUAL, paper: PaperSize! = A4): OrderDocument!

  """When risky cash-on-delivery orders wait for review: the shop's policy."""
  orderRiskSettings: OrderRiskSettings!

  """How many orders are at each stage."""
  orderStageCounts: [OrderStageCount!]!

  """Orders, newest first."""
  orders(
    after: String

    """1 to 250; default 50."""
    first: Int

    """Placed before this."""
    placedBefore: DateTime

    """Placed at or after this."""
    placedFrom: DateTime

    """
    An order number ("1001" or "#1001"), a mobile number in any format, a tracking number, or words of the customer's name, city or email.
    """
    query: String
    riskLevel: OrderRiskLevel
    stage: OrderStage
  ): OrderConnection!
  page(id: ID!): Page

  """The shop's pages, oldest first."""
  pages(
    after: String

    """1 to 250; default 50."""
    first: Int
  ): PageConnection!

  """A product by ID, or null if not found."""
  product(id: ID!): Product

  """A product by handle, or null."""
  productByHandle(handle: String!): Product

  """Tags in use, for pickers and filters."""
  productTags(
    """1 to 250, most used first."""
    first: Int! = 100
  ): [String!]!

  """Product types in use."""
  productTypes(
    """1 to 250, most used first."""
    first: Int! = 100
  ): [String!]!

  """Vendors in use."""
  productVendors(
    """1 to 250, most used first."""
    first: Int! = 100
  ): [String!]!

  """Products, newest first."""
  products(
    """Cursor from a previous page."""
    after: String

    """Page size, 1 to 250."""
    first: Int = 50

    """
    Words to find in the title, vendor, type or tags. Matches Roman Urdu spelling variants (kameez, qameez, kamiz) and Urdu written with Arabic or Urdu letters.
    """
    query: String
  ): ProductConnection!

  """A segment by ID, or null if not found."""
  segment(id: ID!): Segment

  """The fields segment queries can use."""
  segmentFilters: [SegmentFilter!]!

  """
  What a query matches now, e.g. while it is being written. A query that does not check is a BAD_USER_INPUT error saying what is wrong and where.
  """
  segmentPreview(
    """Members to show: 1 to 250; default 10."""
    first: Int
    query: String!
  ): SegmentPreview!

  """Segments, newest first."""
  segments(
    after: String

    """1 to 250; default 50."""
    first: Int
  ): SegmentConnection!

  """The shop of the current access token."""
  shop: Shop!
  theme(id: ID!): OnlineStoreTheme

  """
  The shop's themes: the main one, which the storefront shows, first, then the newest.
  """
  themes(
    after: String

    """1 to 250; default 50."""
    first: Int

    """Only themes with these roles."""
    roles: [ThemeRole!]
  ): OnlineStoreThemeConnection!
  urlRedirect(id: ID!): UrlRedirect

  """The shop's URL redirects, oldest first."""
  urlRedirects(
    after: String

    """1 to 250; default 50."""
    first: Int

    """Only redirects whose path or target has this text."""
    query: String
  ): UrlRedirectConnection!
}

"""Money given back on an order, as staff recorded it."""
type Refund {
  amount: Money!
  createdAt: DateTime!
  id: ID!
  method: RefundMethod!

  """Why, for the shop's records."""
  note: String!

  """
  The transfer's reference, such as a wallet transaction ID. Cleared, with the note, when the customer's data is erased.
  """
  reference: String
}

"""
How a refund went back to the customer. Staff send the money; Hatti records it.
"""
enum RefundMethod {
  """To a bank account, such as by IBFT or Raast."""
  BANK_TRANSFER

  """In cash."""
  CASH

  """To a JazzCash or Easypaisa wallet."""
  MOBILE_WALLET

  """Another way; the note says which."""
  OTHER
}

"""
A saved customer filter, e.g. "Lahore · bought 2+ times · no order in 60 days". Its members are the customers who match it now.
"""
type Segment {
  createdAt: DateTime!
  id: ID!

  """How many customers match it now."""
  memberCount: Int!

  """The customers who match it now, newest first."""
  members(
    after: String

    """1 to 250; default 50."""
    first: Int
  ): CustomerConnection!
  name: String!

  """
  Conditions on segment fields (see segmentFilters) joined with AND, OR, NOT and parentheses: number_of_orders >= 2 AND last_order_date < -60d.
  """
  query: String!
  updatedAt: DateTime!

  """Starts at 1 and increases with every change."""
  version: Int!
}

type SegmentConnection {
  edges: [SegmentEdge!]!
  nodes: [Segment!]!
  pageInfo: PageInfo!
}

type SegmentCreatePayload {
  segment: Segment
  userErrors: [UserError!]!
}

type SegmentDeletePayload {
  deletedSegmentId: ID
  userErrors: [UserError!]!
}

type SegmentEdge {
  cursor: String!
  node: Segment!
}

"""A field segment queries can use."""
type SegmentFilter {
  description: String!

  """A condition using it."""
  example: String!

  """As written in queries, e.g. "number_of_orders"."""
  name: String!

  """The operators it takes, e.g. ">=", "IN", "CONTAINS"."""
  operators: [String!]!
  type: SegmentFilterType!
}

"""What a segment field holds, which decides the conditions it takes."""
enum SegmentFilterType {
  """True or false: blocked = false."""
  BOOLEAN

  """
  A day in Pakistan time: last_order_date > 2026-09-01, or last_order_date < -60d for more than 60 days ago (d, w, m or y; also today and yesterday).
  """
  DATE

  """An amount in the shop's currency: amount_spent > 5000."""
  MONEY

  """A whole number: number_of_orders >= 2."""
  NUMBER

  """Text, ignoring case: city IN (Lahore, 'Rahim Yar Khan')."""
  TEXT

  """A list of text: customer_tags CONTAINS 'wholesale'."""
  TEXT_LIST
}

"""What a query matches now, before it is saved as a segment."""
type SegmentPreview {
  memberCount: Int!

  """The newest members first."""
  members: [Customer!]!
}

type SegmentUpdatePayload {
  segment: Segment
  userErrors: [UserError!]!
}

"""A variant's value for one option."""
type SelectedOption {
  """The option, e.g. "Size"."""
  name: String!

  """The value, e.g. "M"."""
  value: String!
}

