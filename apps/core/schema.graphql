  """
  checkoutTrustBadgesUpdate(badges: [CheckoutTrustBadgeInput!]!): CheckoutTrustBadgesUpdatePayload!

  """
  Imports a courier's remittance statement, as the CSV or the Excel workbook the courier sends: a row per parcel, found by its tracking number ("Tracking Number", "CN" and the like), with the cash collected ("COD Amount"), and the charges, tax withheld and net amount when it has them, under a header row the courier's title rows may come above. Each parcel's cash is received on its order, at most what the order owes, and its charges kept as the parcel's courierCharges, all in one go; cash for a parcel the courier lost pays the parcel's claim, filing one if the shop had not. Lines that match no parcel, or one paid for before, receive nothing and are kept to look into; other cash on a parcel whose order the courier paid short pays what it still owes (ADR-246). A statement is imported once: one with the same lines as one imported before, however it was saved, is refused. Staff need to be an owner, a manager or an accountant.
  """
  codRemittanceImport(
    """The courier, as staff name it, such as "Leopards"."""
    courier: String!

    """The statement as the CSV the courier sends; or xlsx."""
    csv: String

    """Read the statement and say what would happen, writing nothing."""
    dryRun: Boolean

    """
    The statement's number or the payment's reference: the same courier's again is refused. Statements of charges alone with the same lines are told apart by theirs.
    """
    reference: String

    """
    The statement as the Excel workbook (.xlsx) the courier sends, in base64 or as a data URL, of at most 1.4 MB: its first sheet shown is read as the CSV is, long tracking numbers with all their digits (ADR-246). Excel 97-2003 workbooks (.xls) are not read.
    """
    xlsx: String
  ): CodRemittanceImportPayload!

  """Adds products to the end of a manual collection."""
  collectionAddProducts(id: ID!, productIds: [ID!]!): CollectionPayload!
