"""
What checkout asks for in advance on orders paid on delivery (CHK-10), saying it beside the option: the customer pays it by bank transfer into the shop's account, the order waits for it as an order paid by transfer waits for its money, and the courier collects the rest. On every order, or only on those that meet each of its conditions: above a total, to one of its cities, by a customer who refused parcels before or is new to the shop, scored at a risk or higher. Checkout asks for none while the shop gives no account.
"""
type CashOnDeliveryAdvance {
  """
  Only on orders whose items, after any discount code, come to more; null for every order.
  """
  above: Money

  """What a FIXED_AMOUNT asks for."""
  amount: Money

  """
  Only on orders to these cities, as addresses spell them: "Quetta". Empty for every city. Checkout names them all beside the option.
  """
  cities: [String!]!
  kind: CashOnDeliveryAdvanceKind!

  """
  Only of customers new to the shop: none of their orders delivered before, by any of their numbers. Checkout says so, and placing the order counts the deliveries of the number typed.
  """
  newCustomers: Boolean!

  """Percent of the order's items, for PERCENTAGE: 20 is 20%."""
  percentage: Float

  """
  Only of customers who refused this many parcels before, or more, as their delivery history counts them; null for every customer. Checkout says so, without looking anyone up, and placing the order counts the refusals of the number typed.
  """
  refusedDeliveries: Int

  """
  Only of orders the shop's risk rules score this or more, 0.01 to 1, as they are placed: such an order is asked the advance instead of waiting for review, and keeps its score. Null for every order.
  """
  riskScore: Float
}

"""
An amount, a percentage or the delivery charge: one of the three; on every order, or only on those that meet each condition given.
"""
input CashOnDeliveryAdvanceInput {
  """
  Only on orders whose items come to more, in the shop currency: "10,000". Blank or null for every order.
  """
  above: String

  """An amount, in the shop currency: "500"."""
  amount: String

  """
  Only on orders to these cities, by name, alias or code, as addresses have them: "Quetta", "khi". Empty or null for every city. Up to 50.
  """
  cities: [String!]

  """True for the order's delivery charge."""
  deliveryCharge: Boolean

  """
  True for customers new to the shop alone: none of their orders delivered.
  """
  newCustomers: Boolean

  """
  Percent of the order's items after any discount code, 0.01 to 100, with two decimals at most.
  """
  percentage: Float

  """
  Only of customers who refused this many parcels before, or more: 1 to 100; null for every customer.
  """
  refusedDeliveries: Int

  """
  Only of orders the risk rules score this or more: 0.01 to 1, in hundredths; null for every order.
  """
  riskScore: Float
}

"""What cash on delivery asks for in advance."""
enum CashOnDeliveryAdvanceKind {
  """The order's delivery charge: nothing where delivery is free."""
  DELIVERY_CHARGE

  """An amount, never more than the order's items."""
  FIXED_AMOUNT

  """
  A percentage of the order's items after any discount code, to the rupee.
  """
  PERCENTAGE
}

"""
The shop's rules for cash on delivery at checkout (CHK-07): where they keep it from an order, checkout offers bank transfer instead, or says why it can't take the order. Orders staff and apps place are the shop's own call, and keep to the law's cap alone.
"""
type CashOnDeliverySettings {
  """What it asks for in advance (CHK-10); null for nothing."""
  advance: CashOnDeliveryAdvance

  """
  What an order paid on delivery is charged for it (CHK-08): checkout adds it, and the order keeps it apart from delivery. Nothing unless set.
  """
  fee: Money!

  """
  No cash on delivery for orders above it; null for no limit but the law's, Rs 200,000.
  """
  maxOrderTotal: Money

  """
  Customers who refused this many parcels before, or more, pay another way; null for no limit. Their delivery history counts them: refused or undeliverable, coming back or back.
  """
  refusedDeliveriesLimit: Int

  """
  Orders the shop's risk rules score this or more, 0.01 to 1, as they are placed, pay another way (COD-06): checkout places such an order, sees its score and undoes it, then asks for a bank transfer instead, or says it can't take the order paid on delivery. Above the advance's riskScore, where it asks one by risk. Null for no limit.
  """
  riskScoreLimit: Float

  """
  Cities where checkout doesn't offer it, as addresses spell them: "Gilgit".
  """
  unavailableCities: [String!]!

  """
  Products tagged with any of these, in any letter case, are paid another way, such as pre-orders and custom stitching: "pre-order". A cart holding one is offered bank transfer alone.
  """
  unavailableProductTags: [String!]!

  """null while the shop has set none."""
  updatedAt: DateTime

  """
  Orders the shop's risk rules score this or more, 0 to 1, as they are placed, ask the shopper first for a code sent on WhatsApp, or by SMS, to the number they typed (CHK-09): checkout places such an order, sees its score and undoes it until they give the code. 0 for every order paid on delivery; null for none.
  """
  verifyFromScore: Float
}

"""Those not given stay as they are."""
input CashOnDeliverySettingsInput {
  """
  Replaces what it asks for in advance, which needs the shop's bank account. null takes it away; orders placed before keep theirs.
  """
  advance: CashOnDeliveryAdvanceInput

  """Decimal, e.g. "100"; null for nothing."""
  fee: String

  """Decimal, e.g. "25,000"; null or blank for no limit but the law's."""
  maxOrderTotal: String

  """1 to 100; null for no limit."""
  refusedDeliveriesLimit: Int

  """
  0.01 to 1, in hundredths, above the advance's riskScore; null for no limit.
  """
  riskScoreLimit: Float

  """
  Replaces them all; an empty list for none. Cities by name, alias or code, as addresses have them: "Gilgit", "isb". Up to 200.
  """
  unavailableCities: [String!]

  """
  Replaces them all; an empty list for none. Tags as the shop writes them on its products, each once in any letter case. Up to 50.
  """
  unavailableProductTags: [String!]

  """
  0 to 1, in hundredths; 0 for every order paid on delivery; null for none.
  """
  verifyFromScore: Float
}

type CashOnDeliverySettingsUpdatePayload {
  cashOnDeliverySettings: CashOnDeliverySettings
  userErrors: [UserError!]!
}

