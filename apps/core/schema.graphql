"""
What checkout asks for in advance on orders paid on delivery (CHK-10), saying it beside the option: the customer pays it by bank transfer into the shop's account, the order waits for it as an order paid by transfer waits for its money, and the courier collects the rest. On every order, or only on those that meet each of its conditions: above a total, to one of its cities, by a customer who refused parcels before or is new to the shop, scored at a risk or higher, holding a product it tags. Checkout asks for none while the shop gives no account.
"""
type CashOnDeliveryAdvance {
  """
  Only on orders whose items, after any discount code, come to more; null for every order.
  """
  above: Money

  """What a FIXED_AMOUNT asks for."""
  amount: Money

  """
  Only on orders to these cities, as addresses spell them: "Quetta". Empty for every city. Checkout names them all beside the option.
  """
  cities: [String!]!
  kind: CashOnDeliveryAdvanceKind!

  """
  Only of customers new to the shop: none of their orders delivered before, by any of their numbers. Checkout says so, and placing the order counts the deliveries of the number typed.
  """
  newCustomers: Boolean!

  """
  True where an amount or a percentage is counted on the products tagged with productTags alone, what they come to after the code's share of them, rather than on all the order's items: a share of the suits stitched to measure, the ready-made kurtas paid at the door.
  """
  onTaggedProducts: Boolean!

  """Percent of the order's items, for PERCENTAGE: 20 is 20%."""
  percentage: Float

  """
  Only on orders holding a product tagged with any of these, in any letter case, such as pre-orders and custom stitching, paid in part ahead: "pre-order". Empty for every order. Checkout names the product beside the option.
  """
  productTags: [String!]!

  """
  Only of customers who refused this many parcels before, or more, as their delivery history counts them; null for every customer. Checkout says so, without looking anyone up, and placing the order counts the refusals of the number typed.
  """
  refusedDeliveries: Int

  """
  Only of orders the shop's risk rules score this or more, 0.01 to 1, as they are placed: such an order is asked the advance instead of waiting for review, and keeps its score. Null for every order.
  """
  riskScore: Float
}

"""
An amount, a percentage or the delivery charge: one of the three; on every order, or only on those that meet each condition given.
"""
input CashOnDeliveryAdvanceInput {
  """
  Only on orders whose items come to more, in the shop currency: "10,000". Blank or null for every order.
  """
  above: String

  """An amount, in the shop currency: "500"."""
  amount: String

  """
  Only on orders to these cities, by name, alias or code, as addresses have them: "Quetta", "khi". Empty or null for every city. Up to 50.
  """
  cities: [String!]

  """True for the order's delivery charge."""
  deliveryCharge: Boolean

  """
  True for customers new to the shop alone: none of their orders delivered.
  """
  newCustomers: Boolean

  """
  True to count the amount or the percentage on the products with productTags alone, which it needs; not with the delivery charge.
  """
  onTaggedProducts: Boolean

  """
  Percent of the order's items after any discount code, 0.01 to 100, with two decimals at most.
  """
  percentage: Float

  """
  Only on orders holding a product with one of these tags, as the shop writes them on its products, each once in any letter case. Empty or null for every order. Up to 50.
  """
  productTags: [String!]

  """
  Only of customers who refused this many parcels before, or more: 1 to 100; null for every customer.
  """
  refusedDeliveries: Int

  """
  Only of orders the risk rules score this or more: 0.01 to 1, in hundredths; null for every order.
  """
  riskScore: Float
}

"""What cash on delivery asks for in advance."""
enum CashOnDeliveryAdvanceKind {
  """The order's delivery charge: nothing where delivery is free."""
  DELIVERY_CHARGE

  """An amount, never more than the order's items."""
  FIXED_AMOUNT

  """
  A percentage of the order's items after any discount code, to the rupee.
