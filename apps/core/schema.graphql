  """What the password page tells shoppers; empty for nothing."""
  passwordMessage: String!

  """
  Days after delivery the shop takes items back (OS-11, ADR-468), which its product pages say and its products' structured data gives: 0 for no returns; null for nothing said besides its refund policy.
  """
  returnDays: Int

  """Whether the shop exchanges what comes back, never refunding it."""
  returnExchangesOnly: Boolean!

  """
  Rules the shop adds to its storefront's robots.txt, one a line, as crawlers read them; empty for none.
  """
  robotsTxtRules: String!

  """
  What search engines and link previews are told of its home page in place of its name (ADR-243), as Shopify's homepage title and meta description.
  """
