  paymentGatewayAccountConnect(input: PaymentGatewayAccountInput!): PaymentGatewayAccountPayload!

  """
  Changes a payment gateway account: its credentials, or its environment with new ones.
  """
  paymentGatewayAccountUpdate(id: ID!, input: PaymentGatewayAccountInput!): PaymentGatewayAccountPayload!

  """
  Settles a refund through the gateway whose answer never came (UNKNOWN, or PENDING past a few minutes), as the gateway's dashboard shows it: given back, which records the order's refund, or not, which frees what it held. Staff need to be an owner or a manager.
  """
  paymentRefundSettle(id: ID!, input: PaymentRefundSettleInput!): PaymentRefundSettlePayload!
  productCreate(input: ProductCreateInput!): ProductCreatePayload!

  """Adds images by URL, after the existing ones."""
  productCreateMedia(media: [CreateMediaInput!]!, productId: ID!): ProductCreateMediaPayload!

  """Deletes a product with its variants, options and media."""
