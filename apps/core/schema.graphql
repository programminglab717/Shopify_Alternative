    ids: [ID!]!
    reason: OrderCancelReason!

    """For each timeline."""
    staffNote: String
  ): OrderBulkPayload!

  """Confirms up to 250 orders, as orderConfirm does each."""
  orderBulkConfirm(ids: [ID!]!): OrderBulkPayload!

  """Marks up to 250 orders packed, as orderMarkPacked does each."""
  orderBulkMarkPacked(ids: [ID!]!): OrderBulkPayload!

  """Removes tags from up to 250 orders, ignoring case."""
