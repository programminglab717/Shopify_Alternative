  CHARGED

  """
  Cash for a parcel the courier lost: it paid the parcel's claim, filed or not. Cash for one whose claim was paid otherwise, or withdrawn, is NOT_OWED.
  """
  COMPENSATED

  """
  Cash for an order that owes none, or is not open cash on delivery: nothing was received.
  """
  NOT_OWED

  """More than the order owed: what it owed was received, and no more."""
  OVER

  """Its cash was what the order owed, and was received on it."""
  RECEIVED

  """
