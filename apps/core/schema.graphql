  upsertedThemeFiles: [OnlineStoreThemeFile!]!
  userErrors: [UserError!]!
}

type ThemePublishPayload {
  theme: OnlineStoreTheme
  userErrors: [UserError!]!
}

"""Whether the storefront shows a theme."""
enum ThemeRole {
  """The theme the storefront shows. A shop has one."""
  MAIN

  """Being prepared, or shown before; publish it to show it."""
  UNPUBLISHED
}

"""A parcel's courier and tracking number."""
type TrackingInfo {
  """e.g. "TCS", "Leopards", "PostEx"."""
  company: String
  number: String

  """Where the customer can follow it."""
  url: String
}

"""
What checkout takes off orders paid by bank transfer, as the shop's prepaid incentive (CHK-08): off the order's items after any discount code. The order keeps it in totalDiscounts, and apart as transferDiscount.
"""
type TransferDiscount {
  """Off the order's items, for FIXED_AMOUNT, never more than they come to."""
  amount: Money

  """The most a PERCENTAGE takes off an order; null for no cap."""
  cap: Money
  kind: TransferDiscountKind!

  """Percent off the order's items, for PERCENTAGE: 5 is 5%."""
  percentage: Float
}

"""A percentage off, with a cap or not, or an amount off: one of the two."""
input TransferDiscountInput {
  """
  An amount off the order's items after any discount code, in the shop currency: "150".
  """
  amount: String

  """
  The most a percentage takes off an order, in the shop currency: "500". Blank for no cap.
  """
  cap: String

  """
  Percent off the order's items after any discount code, 0.01 to 50, with two decimals at most.
  """
  percentage: Float
}

"""What paying by bank transfer takes off."""
enum TransferDiscountKind {
  """An amount off the order's items."""
  FIXED_AMOUNT

  """A percentage of the order's items, up to a cap if one is set."""
  PERCENTAGE
}

"""
A receipt for a bank transfer, which the customer sent through their order's page: a photo, a screenshot or a PDF (ADR-080).
"""
type TransferReceipt {
  createdAt: DateTime!

  """Bytes."""
  fileSize: Int!
  id: ID!

  """image/jpeg, image/png, image/webp or application/pdf."""
  mimeType: String!

  """
  Where it is shown, for an hour from when it was asked for, named for its order: "Receipt #1023-1.jpg".
  """
  url: String!
}

"""
A visit's UTM parameters, as its landing page's query gave them: the shop's own words for the link the shopper followed.
"""
type UTMParameters {
  """utm_campaign: the campaign, such as "eid-sale"."""
  campaign: String

  """
  utm_content: which ad or link of the campaign, such as "red-kurta-video".
  """
  content: String

  """
  utm_medium: the kind of link, such as "paid_social", "email" or "influencer".
  """
  medium: String

  """utm_source: where the link was, such as "facebook" or "newsletter"."""
  source: String

  """utm_term: the search terms bought, for a search ad's link."""
  term: String
}

input UpdateMediaInput {
  alt: String
  id: ID!
}

"""
A redirect from an address the shop has no page at, such as its old store's /products/old-lawn, to another: the storefront follows it only where it would otherwise answer 404, in both languages.
"""
type UrlRedirect {
  createdAt: DateTime!
  id: ID!

  """
  The path it sends shoppers from, as the storefront compares addresses: lowercase, without a query, a trailing slash or the /ur prefix.
  """
  path: String!

  """Where it sends them: a path on the shop, or an http(s) address."""
  target: String!
  updatedAt: DateTime!
}

type UrlRedirectConnection {
  edges: [UrlRedirectEdge!]!
  nodes: [UrlRedirect!]!
  pageInfo: PageInfo!
}

type UrlRedirectCreatePayload {
  urlRedirect: UrlRedirect
  userErrors: [UserError!]!
}

type UrlRedirectDeletePayload {
  deletedUrlRedirectId: ID
  userErrors: [UserError!]!
}

type UrlRedirectEdge {
  cursor: String!
  node: UrlRedirect!
}

"""A row of a redirects file that did not go in, and why."""
type UrlRedirectImportRowError {
  """The column's heading in the file; null for the row as a whole."""
  column: String
  message: String!

  """Its row in the file, the headings being row 1."""
  row: Int!
}

"""A redirect: what is given of it."""
input UrlRedirectInput {
  """
  A path on the shop, or an address of it pasted whole. Needed to make one.
  """
  path: String

  """Needed to make one."""
  target: String
}

type UrlRedirectUpdatePayload {
  urlRedirect: UrlRedirect
  userErrors: [UserError!]!
}

"""The shop's redirects as a file, as Shopify exports them."""
type UrlRedirectsExport {
  count: Int!

  """CSV with Redirect from and Redirect to columns, by path."""
  csv: String!
}

type UrlRedirectsImportPayload {
  """Redirects made, or that would be in a dry run."""
  created: Int!
  dryRun: Boolean!
  rowErrorCount: Int!

  """The first 100, in the order of the file."""
  rowErrors: [UrlRedirectImportRowError!]!

  """Rows under the headings."""
  rows: Int!

  """
  Rows left as they are: the shop has a redirect from their paths already.
  """
  skipped: Int!
  userErrors: [UserError!]!
}

"""A problem with the input of a mutation, for showing to the user."""
type UserError {
  """Stable machine-readable code, e.g. BLANK, TAKEN, INVALID, NOT_FOUND."""
  code: String!

  """Path to the input field at fault, e.g. ["input", "title"]."""
  field: [String!]
  message: String!
}
