  """When the shop last changed them; none while it never has."""
  updatedAt: DateTime
}

input OnlinePaymentSettingsInput {
  """
  Replaces what checkout takes off orders paid online. null takes it away; orders placed before keep theirs.
  """
  discount: OnlinePaymentDiscountInput
}

type OnlinePaymentSettingsUpdatePayload {
  onlinePaymentSettings: OnlinePaymentSettings
  userErrors: [UserError!]!
}

