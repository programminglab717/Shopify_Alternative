  WEBHOOK
}

"""A payment gateway shops take payments online through (PAY-01)."""
type PaymentGateway {
  """What connecting an account asks for."""
  credentials: [PaymentGatewayCredentialField!]!

  """The currencies it takes, such as ["PKR", "USD"]."""
  currencies: [String!]!

  """Its key, such as "safepay"."""
  gateway: String!

  """Its name, such as "Safepay"."""
  name: String!

  """What of a payment it gives back through Hatti (ADR-153)."""
  refunds: PaymentGatewayRefunds!

  """Takes nothing from anyone: development and tests only."""
  test: Boolean!
}

"""
The shop's own account with a payment gateway (PAY-01): payments settle to the shop, never through Hatti. Its credentials are never shown. One live account a gateway.
"""
type PaymentGatewayAccount {
  """No new payments through it since; those made still count."""
  archivedAt: DateTime
  createdAt: DateTime!

  """The last four characters of the account's first credential."""
  credentialsHint: String!
  environment: PaymentGatewayEnvironment!

  """The gateway's key, such as "safepay"."""
  gateway: String!

  """Such as "Safepay"."""
  gatewayName: String!
  id: ID!
  updatedAt: DateTime!

  """
  Where the gateway sends its webhooks for the account: add it in the gateway's dashboard, so payments are recorded even when customers do not come back.
  """
  webhookUrl: String!
}

input PaymentGatewayAccountInput {
  """All the gateway asks for: replacing them replaces every one."""
  credentials: [PaymentGatewayCredentialInput!]

  """PRODUCTION unless given. A new one needs its own credentials."""
  environment: PaymentGatewayEnvironment

  """The gateway, by its key, such as "safepay"; connecting only."""
  gateway: String
}

type PaymentGatewayAccountPayload {
  paymentGatewayAccount: PaymentGatewayAccount
  userErrors: [UserError!]!
}

"""A credential a payment gateway asks for, as its dashboard shows it."""
type PaymentGatewayCredentialField {
  """What it goes by in PaymentGatewayCredentialInput, such as "apiKey"."""
  key: String!

  """As staff know it, such as "API key"."""
  label: String!
}

input PaymentGatewayCredentialInput {
  """The credential's key, as PaymentGateway.credentials lists it."""
  key: String!

  """As the gateway gave it."""
  value: String!
}

"""Which of a gateway's environments an account takes payments in."""
enum PaymentGatewayEnvironment {
  """The real one."""
  PRODUCTION

  """
  The gateway's test environment: its payments move no money, so they pay no order.
  """
  SANDBOX
}

"""
What of a payment a gateway gives back through Hatti, by orderRefund with ONLINE (ADR-153).
"""
enum PaymentGatewayRefunds {
  """Nothing: refund in the gateway's dashboard, then record it."""
  NONE

  """Any part of a payment."""
  PARTIAL

  """A payment whole, as it was paid; part of one in its dashboard."""
  WHOLE
}

"""
Money asked back of a payment through its gateway (PAY-06, ADR-153), by orderRefund with ONLINE.
"""
type PaymentRefund {
  amount: Money!
  createdAt: DateTime!

  """Why the gateway refused it, or why no answer came."""
  error: String
  id: ID!

  """
  The gateway's reference for it once refunded; the payment's own name for it when the gateway gives none.
  """
  reference: String

  """The order's refund it was written as, once refunded."""
  refundId: ID
  status: PaymentRefundStatus!
  updatedAt: DateTime!
}

input PaymentRefundSettleInput {
  """
  The gateway's reference for it, as its dashboard shows it, when given back.
  """
  reference: String

  """Whether the gateway's dashboard shows it given back."""
  refunded: Boolean!
}

type PaymentRefundSettlePayload {
  paymentRefund: PaymentRefund
  userErrors: [UserError!]!
}

"""What became of money asked back of a payment through its gateway."""
enum PaymentRefundStatus {
  """
  The gateway is being asked. Past a few minutes, its answer was lost: settle it with paymentRefundSettle.
  """
  PENDING

  """Given back: the order's refund records it."""
  REFUNDED

  """The gateway would not give it back: see error."""
  REFUSED

  """
  The gateway did not answer, so it may have given it back: check the gateway's dashboard, then settle it with paymentRefundSettle. It holds its amount meanwhile.
  """
  UNKNOWN
}

"""
A payment the customer started online from their order's page (PAY-04), through the shop's gateway account, for what the order waited for then.
"""
type PaymentSession {
  accountId: ID!

  """What the customer was asked to pay."""
  amount: Money!

  """
  What of it was paid on the order: at most what it owed; nothing for a sandbox payment. The rest is on the order's timeline, to give back.
  """
  applied: Money
  createdAt: DateTime!
  environment: PaymentGatewayEnvironment!

  """Why the gateway would not start it."""
  error: String

  """Such as "Safepay"."""
  gatewayName: String!

  """The gateway's name for the payment, such as Safepay's tracker."""
  gatewayRef: String
  id: ID!
  orderId: ID!

  """What was paid, as the gateway said."""
  paidAmount: Money
  paidAt: DateTime
  paidThrough: PaymentConfirmation

  """The gateway's reference for the payment."""
  reference: String

  """What was asked back of it through the gateway, the oldest first."""
  refunds: [PaymentRefund!]!
  status: PaymentSessionStatus!
  updatedAt: DateTime!
}

"""What became of a payment the customer started online."""
enum PaymentSessionStatus {
  """The gateway would not start it: see error."""
  FAILED

  """Started: the gateway has not said it is paid."""
  OPEN

  """The gateway said it is paid; what the order owed of it is paid on it."""
  PAID
}

