  Sets the channels the checkout's page offers a box for the shop's news and offers on, each once; none for no boxes. A box ticked records the customer's consent on its channel as the order is placed, from CHECKOUT.
  """
  checkoutMarketingChannelsUpdate(channels: [MarketingChannel!]!): CheckoutMarketingChannelsUpdatePayload!

  """
  Sets how long after a shopper leaves checkout, having typed their number, they are reminded once on WhatsApp, of 30, 60, 180 or 600 minutes; null for never. And which of the shop's discount codes, a percentage or an amount off, those still not ordering are offered 12, 24 or 48 hours after the reminder (ADR-426): left out, the offer stays as it is; null for none. No offer goes without the reminder. Each reminder and offer is a marketing message, charged to the shop as its messages are.
  """
  checkoutRecoverySettingsUpdate(offerAfterHours: Int, offerDiscountCodeId: ID, reminderAfterMinutes: Int): CheckoutRecoverySettingsUpdatePayload!

