  Runs a query for all of one list in the background, as the caller, a page at a time, writing each node to a JSONL file: one list at its top, with its nodes or edges, and without first, last, after or before. The scopes it needs are the list’s own. Its pages cost nothing of the query budget; one runs at a time for a caller.
  """
  bulkOperationRunQuery(query: String!): BulkOperationPayload!

  """
  Changes the shop's rules for cash on delivery, for checkouts from now on. Those not given stay as they are.
  """
  cashOnDeliverySettingsUpdate(input: CashOnDeliverySettingsInput!): CashOnDeliverySettingsUpdatePayload!

