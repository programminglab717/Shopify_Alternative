type Mutation {
  """
  Records what the shop spent on its ads (ADR-553), day by day, by platform and, where it says, by campaign as its links' utm_campaign names it: each replaces what that day had, and an amount of 0 takes it away. The sales report takes it off the orders' profit. At most 400 at a time, all or none.
  """
  adSpendSet(entries: [AdSpendInput!]!): AdSpendSetPayload!

  """
  Adds an affiliate: their link is the storefront with ?ref= and their `ref`, and orders placed with their discount code are theirs too. Only orders placed from now count.
  """
  affiliateCreate(input: AffiliateCreateInput!): AffiliateCreatePayload!

  """
  Records that the shop paid an affiliate, as it did it: what is owed them goes down by it.
  """
  affiliatePayoutRecord(input: AffiliatePayoutRecordInput!): AffiliatePayoutRecordPayload!

  """
  Changes an affiliate, or ends their part: orders placed after it earn them nothing. Their figures are left to `affiliates`.
