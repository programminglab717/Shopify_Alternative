type Mutation {
  """
  Blocks a number: its new orders are held for review. Blocking a number again replaces its reason and note.
  """
  blocklistAdd(input: BlocklistAddInput!): BlocklistAddPayload!

  """
  Takes a number off the blocklist. Orders already held for review stay held.
  """
  blocklistRemove(
    """A Pakistani mobile number, in any common format."""
    phone: String!
  ): BlocklistRemovePayload!

  """Adds products to the end of a manual collection."""
  collectionAddProducts(id: ID!, productIds: [ID!]!): CollectionPayload!
  collectionCreate(input: CollectionCreateInput!): CollectionPayload!

  """Deletes a collection. Its products stay in the catalog."""
  collectionDelete(input: CollectionDeleteInput!): CollectionDeletePayload!

