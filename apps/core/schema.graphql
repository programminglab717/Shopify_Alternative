"""
A checkout its shopper left after typing their number, kept 30 days (CHK-12, ADR-393): as Shopify's abandoned checkouts, with the number in place of an email.
"""
type AbandonedCheckout {
  """When they last typed their number."""
  abandonedAt: DateTime!

  """When the shopper started it."""
  createdAt: DateTime!
  id: ID!
  lineItems: [AbandonedCheckoutLineItem!]!

  """The name they typed, if any."""
  name: String

  """The code they were offered, as it was named then."""
  offerCode: String

  """When they were offered a discount code after the reminder (ADR-426)."""
  offeredAt: DateTime

  """
  The number they typed, in E.164; masked like "0300 ••••567" for roles that see customers' numbers masked.
  """
  phone: String!

  """The order the same number placed since, after the reminder or not."""
  recoveredOrder: AbandonedCheckoutOrder

  """When they were reminded on WhatsApp; null while they were not."""
  remindedAt: DateTime

  """What the items came to then."""
  subtotalPrice: Money!
}

"""An item as the cart held it when the shopper typed their number."""
type AbandonedCheckoutLineItem {
  quantity: Int!

  """The product's title then."""
  title: String!

  """The variant. It may have been deleted since."""
  variantId: ID!

  """The variant's title then, such as "Red / M" or "Default Title"."""
  variantTitle: String!
}

"""The order that recovered an abandoned checkout."""
type AbandonedCheckoutOrder {
  id: ID!

  """Its number as staff say it, such as #1001."""
  name: String!
}

"""
