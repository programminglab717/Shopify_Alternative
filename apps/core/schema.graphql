  """
  appEmbedEnable(enabled: Boolean!, id: ID!): AppEmbedPayload!

  """
  Offers the calling app's storefront script, or changes it by its handle. Off until the shop turns it on, and off again when its address changes.
  """
  appEmbedSet(input: AppEmbedInput!): AppEmbedPayload!

  """
  Approves an app's charge: an invoice, paid with billingInvoicePay; a test is paid at once. The owner alone, having signed in lately.
  """
  appPurchaseOneTimeApprove(id: ID!): AppPurchaseOneTimeAnswerPayload!

  """
  Asks the shop to pay the calling public app once, in rupees: its owner approves it at `confirmationUrl`. On a development store, a test.
  """
  appPurchaseOneTimeCreate(name: String!, price: MoneyInput!, returnUrl: String!): AppPurchaseOneTimeCreatePayload!

  """Declines an app's charge. The owner alone."""
  appPurchaseOneTimeDecline(id: ID!): AppPurchaseOneTimeAnswerPayload!

  """Uninstalls a public app: its token stops working at once."""
  appUninstall(id: ID!): AppUninstallPayload!

  """
  An AI draft of a blog article's title, body, summary and search engine title and description, from what the shop wants it to say, in the language asked for (MKT-15, ADR-801). It says nothing of the shop the shop did not; nothing is kept: the shop checks it in its form and saves it. Each draft spends one of the AI credits of the shop’s plan; 30 a day per shop.
  """
  articleCopyDraft(input: ArticleCopyDraftInput!): ArticleCopyDraftPayload!

  """
  A new article, which the storefront shows a moment later unless it is not published. Its body and summary are cleaned of anything that could run.
  """
  articleCreate(article: ArticleCreateInput!): ArticleCreatePayload!

  """Deletes an article."""
  articleDelete(id: ID!): ArticleDeletePayload!

  """
  Changes the fields of an article that are given; the others stay as they are.
  """
  articleUpdate(article: ArticleUpdateInput!, id: ID!): ArticleUpdatePayload!

  """
  An automatic discount, which carts and checkouts take from its start until its end.
  """
  automaticDiscountCreate(automaticDiscount: AutomaticDiscountInput!): AutomaticDiscountPayload!

  """Deletes it; orders placed with it keep its title."""
  automaticDiscountDelete(id: ID!): AutomaticDiscountDeletePayload!

  """
  Changes what is given of it; the rest stays. Orders placed with it keep what it took off them. Ending it now stops it.
  """
  automaticDiscountUpdate(automaticDiscount: AutomaticDiscountInput!, id: ID!): AutomaticDiscountPayload!

  """
  Changes the shop's bank account for transfers, turns bank transfer on or off, or changes what paying so takes off, for orders placed from now on: orders placed before keep the account they were given, and what was taken off them. Audited with the account and the discount before and after. Staff confirm who they are first when they signed in over 15 minutes ago.
  """
  bankTransferSettingsUpdate(input: BankTransferSettingsInput!): BankTransferSettingsUpdatePayload!

  """
  Buys AI credits, 100 a pack, paid at once from the shop's message credit (ADR-539): they last until spent, after the month's own. The owner alone, having signed in lately.
  """
  billingAiCreditsBuy(packs: Int! = 1): BillingAiCreditsBuyPayload!

  """
  Chooses credit to buy for the shop's messages: an invoice, paid with billingInvoicePay, whose credit is the shop's once paid. Credit chosen before and not paid for gives way to it. The owner alone, having signed in lately.
  """
  billingCreditsBuy(input: BillingCreditsBuyInput!): BillingCreditsBuyPayload!

  """
  Pays an open invoice through Hatti's own payment gateway: its page to send the owner to. The owner alone, having signed in lately.
  """
  billingInvoicePay(id: ID!): BillingInvoicePayPayload!

  """
  Says an open invoice was paid by transfer or Raast into Hatti's account (billingBankAccount), with the reference the bank or Raast gave the transfer: Hatti's people find it there, and confirm it, which pays the invoice, or refuse it, saying why. An invoice waits on one transfer at a time, and a reference is given once. The owner alone.
  """
