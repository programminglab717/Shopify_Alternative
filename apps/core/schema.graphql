  """
  Changes what the shop charges to deliver an order, for checkouts from now on; the storefront shows it a moment later. Those not given stay as they are.
  """
  deliverySettingsUpdate(input: DeliverySettingsUpdateInput!): DeliverySettingsUpdatePayload!

