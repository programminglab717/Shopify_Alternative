    """The manager to own the shop: usr_…"""
    staffMemberId: ID!
  ): ShopOwnershipTransferPayload!

  """
  Sets one of the shop's policies, or takes it away with a blank body; the storefront shows it a moment later.
  """
  shopPolicyUpdate(shopPolicy: ShopPolicyInput!): ShopPolicyUpdatePayload!

  """
  Invites someone to work in the shop in `role`, by a link the inviter sends them, good for 7 days and accepted once; with `email`, Hatti emails it there too, 20 a day for a shop at most (ADR-167). The owner invites any role but its own; managers, those below them. Staff confirm who they are first when they signed in over 15 minutes ago.
  """
  staffInvitationCreate(
    """Where Hatti emails the link too: the address of whom it is for."""
    email: String

    """What the email says around the link; English unless given."""
    language: EmailLanguage

    """Whom it is for, up to 100 characters: "Bilal, for packing"."""
    note: String
    role: StaffMemberRole!
  ): StaffInvitationCreatePayload!

  """
  Takes back an invitation not yet accepted: its link opens nothing after.
  """
  staffInvitationRevoke(id: ID!): StaffInvitationRevokePayload!

  """
  Removes a staff member the acting member manages: the shop is closed to them from their next request, and their open orders go back to no one. The owner is never removed so. Staff confirm who they are first when they signed in over 15 minutes ago.
  """
  staffMemberRemove(id: ID!): StaffMemberRemovePayload!

  """
  Gives a staff member another role, from the next request they make: both roles must be ones the acting member manages, and nobody changes their own. Staff confirm who they are first when they signed in over 15 minutes ago.
  """
  staffMemberRoleUpdate(id: ID!, role: StaffMemberRole!): StaffMemberRoleUpdatePayload!

  """
  Where to upload files, up to 10 at a time, for an hour: PUT each one there, then make files of them with fileCreate.
  """
  stagedUploadsCreate(input: [StagedUploadInput!]!): StagedUploadsCreatePayload!

  """Ends Hatti's support's access to the shop now. The owner or a manager."""
  supportAccessEnd: SupportAccessEndPayload!

  """
  Lets Hatti's support look at the shop for `minutes`, 15 to 1,440, an hour unless said: it reads, numbers masked, and changes nothing, each of its requests on the audit log. Access still open ends first. The owner alone, having signed in lately.
  """
  supportAccessGrant(
    minutes: Int

    """What it is for, up to 200 characters: "Order #1043 won't ship"."""
    note: String
  ): SupportAccessGrantPayload!

  """
  Changes the sales tax the shop charges, for orders placed from now on: those placed keep theirs. Those not given stay as they are.
  """
  taxSettingsUpdate(input: TaxSettingsUpdateInput!): TaxSettingsUpdatePayload!

  """
  A new theme to prepare before publishing it: on the platform theme, or a copy of the files of `copyFrom`, such as the main theme.
  """
  themeCreate(copyFrom: ID, name: String!): ThemeCreatePayload!

  """Deletes a theme other than the main one."""
  themeDelete(id: ID!): ThemeDeletePayload!

  """
  Deletes the shop's own files from a theme, so the platform theme's show again.
  """
  themeFilesDelete(files: [String!]!, themeId: ID!): ThemeFilesDeletePayload!

  """
