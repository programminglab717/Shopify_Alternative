    """The customer to keep."""
    customerId: ID!

    """The customer to merge in and delete."""
    duplicateId: ID!
  ): CustomerMergePayload!

  """
  A customer's numbers in full, for staff who see them masked, such as a confirmation agent about to call. Every reveal is logged. Roles that see numbers masked without a reveal, such as packers and marketers, are denied.
  """
  customerPhoneReveal(id: ID!): CustomerPhoneRevealPayload!

  """Changes a customer's number, name, email, note or tags."""
  customerUpdate(id: ID!, input: CustomerUpdateInput!): CustomerUpdatePayload!

  """
  Customers as CSV: everyone, a saved segment, or a segment query, up to 10,000. Owners and managers only; every export is recorded.
  """
  customersExport(query: String, segmentId: ID): CustomersExportPayload!

  """
