enum MessageLanguage {
  EN
  UR
}

enum MessageRouting {
  """Updates by SMS, which costs less for a message that needs no answer."""
  ECONOMY

  """Every update on WhatsApp, by SMS when WhatsApp cannot deliver it."""
  RICH
}

enum MessageStatus {
  """It reached the customer's phone."""
  DELIVERED

  """
  Its channel could not deliver it: `error` says why. A WhatsApp one went by SMS.
  """
  FAILED

  """Waiting to go, or to be tried again."""
  PENDING

  """The customer read it: WhatsApp alone says."""
  READ

  """Its channel took it."""
  SENT

  """Not sent: the customer asked the shop to stop."""
  SKIPPED
}

"""How the shop's customers are told about their orders."""
type MessagingSettings {
  """
  Where Hatti's alerts to the shop go on WhatsApp, such as low stock and its bills with Hatti: a mobile number, in E.164. None sends none.
  """
  alertsPhone: String

  """The notifications the shop turned off."""
  disabledNotifications: [MessageKind!]!

  """The messages' language."""
  language: MessageLanguage!

  """
  The minutes in which the shop means to answer a customer who writes (MSG-06): a conversation waiting longer is overdue in the inbox. None sets no time.
  """
  replyTargetMinutes: Int

  """
  Where replies to the shop's emails to its customers go, as their Reply-To: their words say a reply reaches the shop. None says replies aren't read.
  """
  replyToEmail: String
  routing: MessageRouting!

  """Null while never changed."""
  updatedAt: DateTime
}

input MessagingSettingsInput {
  """
  Where Hatti's alerts to the shop go: a Pakistani mobile, as "0300 1234567" or "+923001234567". Null or blank stops them.
  """
  alertsPhone: String

  """The notifications to turn off, all of them; the others are on."""
  disabledNotifications: [MessageKind!]
  language: MessageLanguage

  """
  The minutes in which the shop means to answer a customer, 5 to 1,440; null sets none. Left out, it stays as it is.
  """
  replyTargetMinutes: Int

  """
  Where replies to the shop's emails to its customers go: an email address. Null or blank leaves replies unread.
  """
  replyToEmail: String
  routing: MessageRouting
}

type MessagingSettingsUpdatePayload {
  messagingSettings: MessagingSettings
  userErrors: [UserError!]!
}

