  """Deletes media; variants that showed them show none."""
  productDeleteMedia(mediaIds: [ID!]!, productId: ID!): ProductDeleteMediaPayload!

  """
  Renames or moves an option, and adds, renames or deletes its values. Values that variants use cannot be deleted.
  """
  productOptionUpdate(option: ProductOptionUpdateInput!, optionValuesToAdd: [String!], optionValuesToDelete: [ID!], optionValuesToUpdate: [ProductOptionValueUpdateInput!], productId: ID!): ProductPayload!

  """
  Adds up to 3 options in all. Existing variants take each new option's first value.
  """
  productOptionsCreate(options: [ProductOptionInput!]!, productId: ID!, variantStrategy: ProductOptionCreateVariantStrategy! = LEAVE_AS_IS): ProductPayload!

  """Deletes options, unless variants would then have the same options."""
  productOptionsDelete(options: [ID!]!, productId: ID!): ProductOptionsDeletePayload!

  """Moves media, one move after another."""
  productReorderMedia(moves: [MoveInput!]!, productId: ID!): ProductPayload!
  productUpdate(input: ProductUpdateInput!): ProductUpdatePayload!
  productUpdateMedia(media: [UpdateMediaInput!]!, productId: ID!): ProductPayload!

  """
  Adds variants. Option values the product lacks are added to its options.
  """
  productVariantsBulkCreate(productId: ID!, variants: [ProductVariantsBulkInput!]!): ProductVariantsBulkPayload!

  """Deletes variants; at least one must remain."""
  productVariantsBulkDelete(productId: ID!, variantsIds: [ID!]!): ProductPayload!

  """Changes variants in one go; two variants may swap option values."""
  productVariantsBulkUpdate(productId: ID!, variants: [ProductVariantsBulkUpdateInput!]!): ProductVariantsBulkPayload!

  """
  Imports products from a Shopify product export, as CSV: rows grouped by Handle into products with their options, variants, prices, SKUs, weights, tags, status and images (by address, https only), each keeping its handle, and the stock Shopify tracked at the primary location. Products whose handles the shop has are left as they are, or with overwrite updated from the file: their fields from the file's columns, a blank cell clearing an optional one; their variants matched by option values, new combinations added; the images they lack added; their variants' stock left alone. productsExport writes such a file. dryRun checks the file and counts, changing nothing.
  """
  productsImport(
    """The file's text, at most 1,500,000 characters."""
    csv: String!
    dryRun: Boolean

    """
    Update the shop's products whose handles the file has, rather than leave them: their options must be the same. Default false.
    """
    overwrite: Boolean
  ): ProductsImportPayload!

  """
  Cancels a return still on its way back, as when its customer keeps the items after all.
  """
  returnCancel(id: ID!): ReturnCancelPayload!

  """
  Records a customer sending back items of a delivered parcel, as when a size is wrong (ADR-136): units of its lines, each no more than were delivered and are not coming back already, with why. It comes back to the location given, or the order's, and is checked in with returnReceive. A refused parcel comes back as itself, with fulfillmentReceiveReturn; money given back is a refund, with orderRefund.
  """
  returnCreate(input: ReturnCreateInput!): ReturnCreatePayload!

  """
  Checks a return in as it arrives: `restock` says how many of each line go back in stock where it came back to; the rest are written off. Everything is restocked if left out.
  """
  returnReceive(id: ID!, restock: [ReturnRestockInput!]): ReturnReceivePayload!

  """
  Keeps a search of one of the shop's lists by name, for all its staff: up to 100 of each list. Needs the scope that changes the list: write_orders, or write_products.
  """
  savedSearchCreate(input: SavedSearchCreateInput!): SavedSearchCreatePayload!

  """Deletes a saved search."""
  savedSearchDelete(input: SavedSearchDeleteInput!): SavedSearchDeletePayload!

  """
  Renames a saved search, or changes its query, checked by its list; it keeps its place.
  """
  savedSearchUpdate(input: SavedSearchUpdateInput!): SavedSearchUpdatePayload!

  """
  Saves a customer filter. The query is checked; problems come back as user errors.
  """
  segmentCreate(name: String!, query: String!): SegmentCreatePayload!

  """Deletes a segment. Its customers stay."""
  segmentDelete(id: ID!): SegmentDeletePayload!

  """Renames a segment or changes its query."""
  segmentUpdate(id: ID!, name: String, query: String): SegmentUpdatePayload!

  """
  Sets the shop's logo, one of its files, which its checkout's page shows in place of its name; or takes it away.
  """
  shopBrandUpdate(input: ShopBrandInput!): ShopBrandUpdatePayload!

  """
  Hands the shop to one of its managers, who needs a passkey or an authenticator app. Only the owner does it, and stays on as a manager from their next request. Staff confirm who they are first when they signed in over 15 minutes ago.
  """
