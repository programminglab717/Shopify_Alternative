;; PgBouncer for local development, CI and tools/db-bench: transaction pooling in front of the
;; local Postgres, as in production. Start it from the repository root:
;;   pgbouncer db/pgbouncer/pgbouncer.ini
;; then point DATABASE_URL (and the other request-serving URLs) at port 6432. Migrations, setup
;; and the worker's LISTEN connection (DATABASE_LISTEN_URL) stay direct, on port 5432.
;; See docs/engineering/conventions.md#connection-pooling.

[databases]
;; Any database name, so tests can create their own databases.
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
;; Relative to the directory PgBouncer starts in: the repository root. It holds the development
;; passwords from .env.example; never use it outside local development and CI.
auth_file = db/pgbouncer/userlist.txt
;; SHOW and RECONNECT commands on the "pgbouncer" admin database, used by tools/db-bench.
admin_users = postgres

;; One server connection per transaction. Session state (SET, LISTEN, advisory locks, temporary
;; tables) does not survive between transactions; use set_config(…, true) and SET LOCAL instead.
pool_mode = transaction
default_pool_size = 20
max_client_conn = 2000

;; Keep a slow query from holding a server connection forever, beyond Postgres's own timeouts.
query_timeout = 30
idle_transaction_timeout = 60

;; The local Postgres needs no encryption. Deployed environments connect with TLS (verify-full).
server_tls_sslmode = disable
