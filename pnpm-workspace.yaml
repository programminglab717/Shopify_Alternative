packages:
  - apps/*
  - packages/platform/*
  - packages/modules/*
  - packages/ui/*
  - tools/*

# Supply-chain hygiene: never install a version published less than a day ago.
minimumReleaseAge: 1440

# pnpm blocks dependency install scripts by default. None are needed: msgpackr-extract is an
# optional native speed-up for BullMQ's msgpackr, whose pure JS fallback is fine, and protobufjs
# only checks its CLI's dependencies.
ignoredBuiltDependencies:
  - msgpackr-extract
  - protobufjs

# Shared dependency versions. Packages reference these with "catalog:".
catalog:
  '@nestjs/common': 12.1.0
  '@nestjs/core': 12.1.0
  '@nestjs/graphql': 14.0.2
  '@nestjs/mercurius': 14.0.2
