# Local dependencies. Start with `docker compose up -d`, then run `pnpm db:setup`.
name: hatti

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: traces, metrics and logs in Grafana (Tempo, Prometheus, Loki and an OpenTelemetry
  # collector in one image). Start with `docker compose --profile observability up -d`, set
  # OTEL_EXPORTER_OTLP_ENDPOINT in .env, then open http://localhost:3000 (admin / admin).
  observability:
    image: grafana/otel-lgtm
    profiles: [observability]
    ports:
      - '3000:3000'
      - '4318:4318'

volumes:
  postgres-data:
