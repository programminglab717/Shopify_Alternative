name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Database and queue tests fail instead of skipping when these are missing in CI.
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Request-serving test connections go through PgBouncer in transaction mode, as in
      # production; setup, migrations and fixtures stay direct.
      DATABASE_POOLER_URL: postgres://127.0.0.1:6432
      REDIS_URL: redis://localhost:6379
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start PgBouncer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          # The package starts its own instance on port 6432; run ours instead.
          sudo systemctl disable --now pgbouncer
          nohup pgbouncer db/pgbouncer/pgbouncer.ini > "$RUNNER_TEMP/pgbouncer.log" 2>&1 &
          timeout 20 bash -c 'until (echo > /dev/tcp/127.0.0.1/6432) 2>/dev/null; do sleep 0.5; done'

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Feature catalog summary
        run: python3 scripts/update_feature_summary.py --check

      - name: Build, typecheck, test
        run: pnpm turbo run build typecheck test

      - name: PgBouncer log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/pgbouncer.log"

      - name: Migrate a fresh database and seed it
        run: |
          cp .env.example .env
          pnpm db:setup
          pnpm db:migrate
          pnpm seed > /dev/null
