name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Database and queue tests fail instead of skipping when these are missing in CI.
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Request-serving test connections go through PgBouncer in transaction mode, as in
      # production; setup, migrations and fixtures stay direct.
      DATABASE_POOLER_URL: postgres://127.0.0.1:6432
      REDIS_URL: redis://localhost:6379
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ffmpeg's packages are kept between runs once one has installed them all: the mirror can
      # be slow, as 55 KB/s on 27 October 2026, too slow for its 63 MB in the step's minutes.
      - name: Restore ffmpeg's packages
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-noble-v1

      - name: Start PgBouncer, install ffmpeg
        id: tools
        timeout-minutes: 10
        run: |
          # A package mirror that stops answering ends a try, not the job's twenty minutes (runs
          # 306 and 307 waited on one until they were cancelled); the next try may reach another.
          # The update says where it is, so that a stall names the source.
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update && timeout 90 sudo apt-get install -y -qq pgbouncer; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          # ffmpeg makes products' videos' smaller sizes (ADR-791), as in the core's image; its
          # tests run where it is, and skip where it is not, so a mirror too slow for it warns
          # and goes on. Its packages come from the cache restored above where they can; the
          # install says what it fetches and drops a connection silent for 20 seconds.
          mkdir -p "$HOME/apt-ffmpeg/partial"
          if timeout 300 sudo apt-get install -y -q -o Dir::Cache::Archives="$HOME/apt-ffmpeg" \
            -o Acquire::http::Timeout=20 -o Acquire::Retries=2 --no-install-recommends ffmpeg; then
            echo "ffmpeg=installed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ffmpeg was not installed in time: its tests are skipped in this run"
          fi
          sudo rm -rf "$HOME/apt-ffmpeg/partial" "$HOME/apt-ffmpeg/lock"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-ffmpeg"
          # The package starts its own instance on port 6432; run ours instead.
          sudo systemctl disable --now pgbouncer
          nohup pgbouncer db/pgbouncer/pgbouncer.ini > "$RUNNER_TEMP/pgbouncer.log" 2>&1 &
          timeout 20 bash -c 'until (echo > /dev/tcp/127.0.0.1/6432) 2>/dev/null; do sleep 0.5; done'

      - name: Keep ffmpeg's packages
        if: steps.tools.outputs.ffmpeg == 'installed' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-noble-v1

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Feature catalog summary
        run: python3 scripts/update_feature_summary.py --check

      - name: Alerts and dashboards
        run: scripts/check-ops.sh

      - name: Build, typecheck, test
        run: pnpm turbo run build typecheck test

      - name: Runtime dependencies
        run: python3 scripts/check_runtime_dependencies.py

      - name: PgBouncer log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/pgbouncer.log"

      - name: Migrate a fresh database and seed it
        run: |
          cp .env.example .env
          pnpm db:setup
          pnpm db:migrate
          pnpm seed > /dev/null

  images:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Both images come from one build of the workspace; its layers are kept between runs.
      - name: Build the core's image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: core
          tags: hatti-core:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the storefront's image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: storefront
          tags: hatti-storefront:ci
          load: true
          cache-from: type=gha

      - name: Run them against an empty database
        run: scripts/image-smoke.sh
