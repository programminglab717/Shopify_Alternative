# The pilot on one machine (ADR-989): Postgres, Valkey, the core's API and worker, the storefront,
# and Caddy in front, taking certificates, built from this repository's Dockerfile on the machine
# itself, so no registry is needed. Everything is free and open source. From deploy/pilot:
#
#   ./init.sh example.pk ops@example.pk     # writes hatti.env, its passwords and keys generated
#   docker compose up -d --build            # builds the images, sets up and migrates, starts
#   docker compose ps                       # each service healthy
#
# Only the proxy is reached from outside, on 80 and 443; the rest talk on the machine's own
# network. The runbook is README.md.
name: hatti-pilot

x-core: &core # Built once, by setup below, and run from here.
  image: hatti-core:pilot
  pull_policy: never
  env_file: hatti.env
  restart: unless-stopped
  depends_on:
    setup:
      condition: service_completed_successfully
    valkey:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    env_file: hatti.env
    restart: unless-stopped
    # Room for the pools of the API, the worker and the storefront's carts, and memory for a
    # machine of 4 to 8 GB.
    command: postgres -c max_connections=200 -c shared_buffers=512MB -c effective_cache_size=2GB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # The queues' jobs kept across restarts, and never evicted: BullMQ needs every key it wrote.
    command: valkey-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30

  # The database made if new, its migrations applied and its logins set from hatti.env's URLs,
  # each time the pilot starts; it then stops.
  setup:
    image: hatti-core:pilot
    build:
      context: ../..
      target: core
    env_file: hatti.env
    command: ['node', '/app/packages/platform/db/dist/cli/setup.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *core
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    <<: *core
    command:
      ['node', '--enable-source-maps', '--import', './dist/instrumentation.js', 'dist/worker.js']

  storefront:
    image: hatti-storefront:pilot
    build:
      context: ../..
      target: storefront
    env_file: hatti.env
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4100/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30

  edge:
    image: hatti-edge:pilot
    build:
      context: ../..
      target: edge
    env_file: hatti.env
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      storefront:
        condition: service_healthy

volumes:
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:
